# Configuração do gitleaks (CLI oficial, ver .github/workflows/secret-scan.yml).
# Estende as regras padrão; a allowlist cobre apenas falsos positivos auditados
# em 07/10/2026 (chaves públicas por design e exemplos de documentação).
title = "Futeba dos Parças — gitleaks"

[extend]
useDefault = true

# Chave de API Web do Firebase (AIza...): identifica o projeto, não é segredo
# (o acesso é controlado por Firestore Rules / App Check). Fica no bundle web.
[[allowlists]]
description = "Firebase Web API key (pública por design)"
targetRules = ["gcp-api-key", "generic-api-key"]
paths = [
  '''web/\.env\.(production|example)$''',
  '''web/public/firebase-messaging-sw\.js$''',
  '''web/src/services/firebase\.ts$''',
  '''web/dist/.*''',
  '''(^|/)index\.html$''',
  # Android: google-services.json traz a mesma classe de chave (identifica o
  # projeto; acesso controlado por Rules/App Check). O arquivo real está no
  # .gitignore; só aparece no histórico (commit inicial).
  '''^app/google-services\.json$''',
]

# reCAPTCHA *site key* é pública (vai no HTML); a secret key nunca entra no repo.
[[allowlists]]
description = "reCAPTCHA site key pública"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''VITE_RECAPTCHA_SITE_KEY=''']

# Exemplos de documentação com valores fictícios (senhaSegura123, eyJhbG...).
[[allowlists]]
description = "Exemplos fictícios em documentação"
targetRules = ["generic-api-key", "curl-auth-header"]
paths = [
  '''API_REFERENCE\.md$''',
  '''backend/CONTROLLERS\.md$''',
  '''MIGRATION_GUIDE\.md$''',
  '''shared/src/commonMain/kotlin/com/futebadosparcas/platform/storage/SecureStorage\.kt$''',
]

# Histórico do vazamento do client_secret OAuth (issue #4343): o literal já foi
# removido do código; estes dois commits o contêm e só serão limpos se o dono
# reescrever o histórico. A allowlist por COMMIT (não por caminho) garante que
# qualquer nova ocorrência no mesmo arquivo seja detectada. A rotação do segredo
# no Google Cloud Console é o que de fato invalida o vazamento.
[[allowlists]]
description = "Commits históricos com client_secret OAuth (issue #4343, a rotacionar)"
commits = [
  "7b77b4e37d4f5fbe5f45382bafbafdcd10de7bc8",
  "171781ea8cc12fa43ca1742cd1be025ddd5b523c",
]

# Regra extra: client_secret literal em código/JSON (as regras padrão só pegaram
# isso via generic-api-key, e uma allowlist por caminho chegou a escondê-lo).
[[rules]]
id = "oauth-client-secret-literal"
description = "client_secret OAuth escrito literalmente"
regex = '''(?i)client_?secret["']?\s*[:=]\s*["'][A-Za-z0-9_\-]{16,}["']'''
tags = ["oauth", "secret"]

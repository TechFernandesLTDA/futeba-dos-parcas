# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8

# Enable Kotlin Native cache cleanup
kotlin.native.cacheKind=none

# Suppress warnings about disabled native targets
kotlin.native.ignoreDisabledTargets=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Use 13 of 15 cores on M5 Pro (leave 2 for macOS/Spotlight)
org.gradle.workers.max=13

# Disable KMP compiler parallel execution (Windows issue)
kotlin.parallel.tasks.in.project=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Build cache HABILITADO (Efficiency Hardening F4, 2026-06-04).
# Foi desabilitado em jan/2026 (commit 738199cd) durante a migracao KMP/Compose
# por corrupcao de cache do KSP2. Desde a migracao para Kotlin 2.4/KSP 2.3 (#4265)
# o KSP2 e o unico modo; a invariante abaixo foi revalidada nessa migracao.
# Decisao local-vs-remoto: os 2 runners macOS rodam como o mesmo usuario na MESMA
# maquina e compartilham ~/.gradle/caches/build-cache-1 — ou seja, o cache LOCAL
# ja e compartilhado entre runners pelo filesystem (cache remoto seria redundante).
# Invariante exigida (verificada no PR): build limpo -> incremental COM cache
# produz outputs de codegen (KSP/Compose) identicos, sem stale. Se algum task de
# codegen voltar a corromper, marque APENAS ele com outputs.cacheIf { false }
# (nao o cache global).
org.gradle.caching=true

# Disable default hierarchy template (fixes KMP warning)
kotlin.mpp.applyDefaultHierarchyTemplate=false

kotlin.incremental.usePreciseJavaTracking=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
# R8 Full Mode - Aggressive optimization (15-20% smaller APK)
android.r8.fullMode=true
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false

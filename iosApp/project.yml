# XcodeGen spec — gera iosApp.xcodeproj a partir de YAML versionado
# Uso: cd iosApp && xcodegen generate
#
# Requisitos prévios:
# 1. Build dos frameworks KMP:
#    ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
#    ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
# 2. CocoaPods: pod install (usa Podfile)
# 3. Abrir iosApp.xcworkspace (gerado por pod install)

name: iosApp
options:
  bundleIdPrefix: com.futebadosparcas
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: "" # Configure no Xcode
    CODE_SIGN_STYLE: Automatic
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.md"
    resources:
      - path: iosApp/Info.plist
        type: file
      - path: iosApp/GoogleService-Info.plist
        type: file
        optional: true
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework
        embed: true
        codeSign: true
      - framework: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.futebadosparcas
        PRODUCT_NAME: iosApp
        INFOPLIST_FILE: iosApp/Info.plist
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../composeApp/build/bin/iosArm64/debugFramework"
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "shared"
          - "-framework"
          - "ComposeApp"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Sem `info:` block — Info.plist mantido manualmente (privacy descriptions,
    # CFBundleURLTypes pra OAuth, UISupportedInterfaceOrientations, etc).
    # `info:` faz xcodegen REGENERAR o plist, sobrescrevendo essas keys.
    preBuildScripts:
      - script: |
          # Build dos frameworks KMP antes de compilar iOS
          cd "$SRCROOT/.."
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
        name: "Build KMP Frameworks (shared + ComposeApp)"
        outputFiles:
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework"
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework"

# Esquema explícito para garantir que xcodegen crie .xcscheme compartilhado.
# Sem isto, Xcode 26.x usa esquema "auto" que falha no xcodebuild CLI.
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

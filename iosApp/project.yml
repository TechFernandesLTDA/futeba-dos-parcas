# XcodeGen spec — gera iosApp.xcodeproj a partir de YAML versionado
# Uso: cd iosApp && xcodegen generate
#
# Requisitos prévios:
# 1. Build do framework KMP (ComposeApp já embute o :shared):
#    ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
# 2. CocoaPods: pod install (usa Podfile)
# 3. Abrir iosApp.xcworkspace (gerado por pod install)

name: iosApp
options:
  bundleIdPrefix: com.futebadosparcas
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: "" # Configure no Xcode
    CODE_SIGN_STYLE: Automatic
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      # O glob de `iosApp/` inclui `release-notes.json` automaticamente — o
      # xcodegen categoriza .json como recurso e o adiciona à fase Copy Bundle
      # Resources. É o fallback offline das "Novidades", lido por
      # ReleaseNotesAssetReader (iosMain) via NSBundle.mainBundle.
      # Gerado por scripts/release-notes.js (BUNDLE_TARGETS.ios).
      - path: iosApp
        excludes:
          - "**/*.md"
          - "**/*.entitlements"
    resources:
      - path: iosApp/Info.plist
        type: file
      - path: iosApp/GoogleService-Info.plist
        type: file
        optional: true
    # Só o ComposeApp é linkado. Ele já contém o código do `:shared` (dependência
    # `implementation(project(":shared"))`) e o runtime do Kotlin/Native. Linkar também
    # o `shared.framework` estático duplicava o runtime (1152 símbolos duplicados no
    # Xcode 27.1 com Kotlin 2.4.20). Nenhum .swift faz `import shared`.
    dependencies:
      - framework: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
        embed: true
        codeSign: true
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.futebadosparcas
        PRODUCT_NAME: iosApp
        # iPhone apenas no lançamento (DECISIONS 2026-10-31): as telas do composeApp
        # ainda são de telefone, e "universal" exigiria ícones e capturas de iPad
        # na submissão. Para liberar iPad, troque para "1,2" e complete o AppIcon.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        # Caminho por SDK: evita o aviso "directory not found" do framework de device
        # num build de simulador (e vice-versa).
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/bin/iosArm64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        # As fases de script chamam o Gradle e gravam no bundle fora de saídas declaradas.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
          APP_ATTEST_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          APP_ATTEST_ENVIRONMENT: production
    # Sem `info:` block — Info.plist mantido manualmente (privacy descriptions,
    # CFBundleURLTypes pra OAuth, UISupportedInterfaceOrientations, etc).
    # `info:` faz xcodegen REGENERAR o plist, sobrescrevendo essas keys.
    preBuildScripts:
      - script: |
          # Build dos frameworks KMP antes de compilar iOS
          if [ "$SKIP_KMP_BUILD" = "YES" ]; then
            echo "Using KMP frameworks prepared by CI"
            exit 0
          fi
          cd "$SRCROOT/.."
          # O ComposeApp embute o :shared; não é preciso linkar o shared.framework.
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
        name: "Build KMP Framework (ComposeApp, inclui shared)"
        outputFiles:
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework"
    # Recursos do Compose Multiplatform (strings.xml, files/). O framework linkado à mão
    # (sem o plugin CocoaPods nem embedAndSignAppleFrameworkForXcode) NÃO leva os .cvr;
    # sem esta fase o app fecha no primeiro stringResource() com MissingResourceException
    # (".../iosApp.app/compose-resources/composeResources/.../strings.commonMain.cvr").
    postCompileScripts:
      - script: |
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            KMP_TARGET=iosSimulatorArm64
            GRADLE_TASK=assembleIosSimulatorArm64MainResources
          else
            KMP_TARGET=iosArm64
            GRADLE_TASK=assembleIosArm64MainResources
          fi
          SRC="$SRCROOT/../composeApp/build/generated/compose/resourceGenerator/assembledResources/${KMP_TARGET}Main"
          # Tarefa barata (só converte XML em .cvr): roda também com SKIP_KMP_BUILD
          # quando os recursos ainda não existem, para o CI não gerar um app que fecha.
          if [ "$SKIP_KMP_BUILD" != "YES" ] || [ ! -d "$SRC/composeResources" ]; then
            (cd "$SRCROOT/.." && ./gradlew ":composeApp:$GRADLE_TASK") || exit 1
          fi
          if [ ! -d "$SRC/composeResources" ]; then
            echo "error: recursos do Compose ausentes em $SRC"
            exit 1
          fi
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/compose-resources"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC/" "$DEST/"
        name: "Copiar recursos do Compose (compose-resources)"
        basedOnDependencyAnalysis: false

  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Os testes iOS legados ainda não pertenciam a um target e alguns não
      # compilam no Xcode atual. Este target focado cobre o ciclo push sem
      # ampliar a manutenção para suites fora do escopo da #3741.
      - path: iosAppTests/Services/PushTokenManagerTests.swift
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.futebadosparcas.tests
        INFOPLIST_FILE: iosAppTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"

# Esquema explícito para garantir que xcodegen crie .xcscheme compartilhado.
# Sem isto, Xcode 26.x usa esquema "auto" que falha no xcodebuild CLI.
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

name: Firestore Rules Tests

on:
  push:
    # Restringe a master/develop (alinhado com android-ci/web-ci) para nao
    # desperdiçar runner em branches de feature (#2201).
    branches: [master, develop]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firestore-rules-tests/**"
      - ".github/workflows/firestore-rules-ci.yml"
  pull_request:
    branches: [master, develop]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firestore-rules-tests/**"
      - ".github/workflows/firestore-rules-ci.yml"

# Cancela runs obsoletas do mesmo branch/PR (#3542) — unico workflow sem isso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    name: Testar Firestore Security Rules
    # Emuladores Firestore+Storage rodam em Linux via setup-java@v4 (#3542).
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: firestore-rules-tests/package-lock.json

      - name: Configurar Java 21 (requerido pelo emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependências dos testes
        run: cd firestore-rules-tests && npm ci

      - name: Liberar portas dos emuladores
        run: lsof -ti:8085,9199,4400,4500 | xargs kill -9 2>/dev/null || true

      - name: Executar testes das Security Rules
        # O emulators:exec sobe o emulador, roda os testes e derruba automaticamente
        # Runner self-hosted Mac pode matar o Firebase CLI quando o Vitest abre
        # muitos workers contra o mesmo emulador. Rodar sequencial estabiliza o CI.
        run: |
          cd firestore-rules-tests
          npx firebase-tools emulators:exec \
            --only firestore,storage \
            --project futebadosparcas \
            'FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_STORAGE_EMULATOR_HOST=127.0.0.1:9199 npx vitest run --reporter=verbose --no-file-parallelism --maxWorkers=1'
        env:
          # CI=true faz o Vitest sair com código de erro se algum teste falhar
          CI: "true"

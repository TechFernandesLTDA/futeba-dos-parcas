name: Firestore Rules Tests

on:
  push:
    paths:
      - "firestore.rules"
      - "firestore-rules-tests/**"
      - ".github/workflows/firestore-rules-ci.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firestore-rules-tests/**"
      - ".github/workflows/firestore-rules-ci.yml"

jobs:
  rules-tests:
    name: Testar Firestore Security Rules
    # Usa runner self-hosted macOS (disponível neste projeto) ou ubuntu como fallback
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: firestore-rules-tests/package-lock.json

      - name: Configurar Java 21 (requerido pelo emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar dependências dos testes
        run: cd firestore-rules-tests && npm ci

      - name: Executar testes das Security Rules
        # O emulators:exec sobe o emulador, roda os testes e derruba automaticamente
        run: |
          cd firestore-rules-tests
          firebase emulators:exec \
            --only firestore \
            --project futebadosparcas \
            'FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 npx vitest run --reporter=verbose'
        env:
          # CI=true faz o Vitest sair com código de erro se algum teste falhar
          CI: "true"

name: Android CI

on:
  push:
    branches: [ master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/BRANCH_STRATEGY.md'
      - 'functions/**'
  pull_request:
    branches: [ master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'functions/**'
  workflow_dispatch:

# Cancela execucoes anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ============================================================
  # Job de setup reutilizavel - prepara o ambiente Android
  # ============================================================
  # Self-hosted Mac (Apple Silicon) por padrao para custo zero.
  # Para forcar github-hosted defina vars.RUNNER_LABELS = ["ubuntu-latest"]
  # em Settings -> Secrets and variables -> Actions -> Variables.
  # Nota: 1 runner serializa os 4 jobs (~30min). Registre 2-3 instancias
  # para paralelismo, ou aceite o tempo serializado.
  lint:
    name: Lint Check
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "placeholder" }]
            }]
          }
          GSEOF

      - name: Run Lint
        run: ./gradlew lint

      - name: Upload Lint Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 7

  detekt:
    name: Detekt Static Analysis
    # Pulado em PRs: pr-check.yml ja roda detekt como fast feedback
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "placeholder" }]
            }]
          }
          GSEOF

      # Detekt usa baseline (detekt-baseline.xml) para ignorar violacoes pre-existentes
      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif
        continue-on-error: true

      - name: Upload Detekt Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: |
            app/build/reports/detekt/
            build/reports/detekt/
          retention-days: 7

  test:
    name: Unit Tests
    # Pulado em PRs: pr-check.yml ja roda unit tests como fast feedback
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "placeholder" }]
            }]
          }
          GSEOF

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

      # Publicar resultados dos testes como check no PR
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040  # v2
        with:
          files: app/build/test-results/**/*.xml
          check_name: "Unit Test Results"
        continue-on-error: true

  build:
    name: Build Debug APK
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 40
    # detekt e test sao skipped em PRs (cobertos por pr-check.yml); build aguarda apenas lint em PRs
    needs: [ lint, detekt, test ]
    if: always() && needs.lint.result == 'success' && (needs.detekt.result == 'success' || needs.detekt.result == 'skipped') && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "placeholder" }]
            }]
          }
          GSEOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # APK so e util para review em PR; em master apenas valida o build (sem upload — evitava ~24GB de quota)
      - name: Upload Debug APK
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      # Tamanho do APK como comentario no PR
      - name: Report APK Size
        if: github.event_name == 'pull_request'
        run: |
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "### APK Size: $APK_SIZE" >> $GITHUB_STEP_SUMMARY

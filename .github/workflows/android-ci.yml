name: Android CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancela execucoes anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'jetbrains'

jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml

  # ============================================================
  # Jobs Android completos rodam apenas em eventos confiaveis (push/manual).
  # Em pull_request, o PR Check executa compile, Detekt e unit tests em Ubuntu;
  # este workflow publica somente o classificador e o Android CI Gate estavel.
  # ============================================================
  # Push/manual usam o Mac self-hosted por padrao para custo zero.
  # Nota: 1 runner serializa os 4 jobs (~30min). Registre 2-3 instancias
  # para paralelismo, ou aceite o tempo serializado.
  lint:
    name: Lint Check
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.android == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-36/android.jar"

      - name: Setup environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "AIzaSyA00000000000000000000000000000000" }]
            }]
          }
          GSEOF

      - name: Run Lint
        run: ./gradlew --max-workers=6 --no-daemon lint

      - name: Upload Lint Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 7

  detekt:
    name: Detekt Static Analysis
    # Pulado em PRs: pr-check.yml ja roda Detekt no gate pesado do PR.
    needs: changes
    if: needs.changes.outputs.android == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-36/android.jar"

      - name: Setup environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "AIzaSyA00000000000000000000000000000000" }]
            }]
          }
          GSEOF

      # Detekt usa baseline (detekt-baseline.xml) para ignorar violacoes pre-existentes
      - name: Run Detekt
        run: ./gradlew --max-workers=6 --no-daemon detekt

      - name: Upload Detekt Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: |
            app/build/reports/detekt/
            build/reports/detekt/
          retention-days: 7

  test:
    name: Unit Tests
    # Pulado em PRs: pr-check.yml ja roda unit tests no gate pesado do PR.
    needs: changes
    if: needs.changes.outputs.android == 'true' && github.event_name != 'pull_request'
    # The result publisher runs only on trusted push/manual events.
    permissions:
      contents: read
      checks: write
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-36/android.jar"

      - name: Setup environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "AIzaSyA00000000000000000000000000000000" }]
            }]
          }
          GSEOF

      - name: Run Unit Tests
        run: ./gradlew --max-workers=6 --no-daemon :app:testDebugUnitTest

      - name: Upload Test Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

      # Publicar resultados dos testes como check no PR
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2
        with:
          files: app/build/test-results/**/*.xml
          check_name: "Unit Test Results"
        continue-on-error: true

  build:
    name: Build Debug APK
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 40
    # Todos os gates completos permanecem obrigatorios em push/manual com impacto Android.
    needs: [ changes, lint, detekt, test ]
    if: always() && github.event_name != 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.android == 'true' && needs.lint.result == 'success' && needs.detekt.result == 'success' && needs.test.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-36/android.jar"

      - name: Setup environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "AIzaSyA00000000000000000000000000000000" }]
            }]
          }
          GSEOF

      - name: Build Debug APK
        run: ./gradlew --max-workers=6 --no-daemon assembleDebug

      # Em push apenas valida o build; execucao manual tambem entrega o APK para diagnostico.
      - name: Upload Debug APK
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      # Tamanho do APK no resumo da execucao manual.
      - name: Report APK Size
        if: github.event_name == 'workflow_dispatch'
        run: |
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "### APK Size: $APK_SIZE" >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Android CI Gate
    if: always()
    needs: [ changes, lint, detekt, test, build ]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 5
    steps:
      - name: Verify scoped Android checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANDROID_CHANGED: ${{ needs.changes.outputs.android }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DETEKT_RESULT: ${{ needs.detekt.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change classification failed."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$LINT_RESULT" != "skipped" ] || [ "$DETEKT_RESULT" != "skipped" ] || [ "$TEST_RESULT" != "skipped" ] || [ "$BUILD_RESULT" != "skipped" ]; then
              echo "Android CI Gradle jobs must be skipped in pull requests."
              exit 1
            fi

            echo "PR Gradle validation is delegated to the required Validate PR check."
            exit 0
          fi

          if [ "$ANDROID_CHANGED" != "true" ]; then
            if [ "$LINT_RESULT" != "skipped" ] || [ "$DETEKT_RESULT" != "skipped" ] || [ "$TEST_RESULT" != "skipped" ] || [ "$BUILD_RESULT" != "skipped" ]; then
              echo "Android jobs ran without Android/KMP impact."
              exit 1
            fi

            echo "No Android/KMP impact; Gradle jobs were intentionally skipped."
            exit 0
          fi

          if [ "$LINT_RESULT" != "success" ] || [ "$DETEKT_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ]; then
            echo "Trusted Android lint, Detekt, unit tests, or build did not complete successfully."
            exit 1
          fi

          echo "Required Android checks completed successfully."

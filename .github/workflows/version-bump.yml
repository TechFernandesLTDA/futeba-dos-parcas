name: Auto Version Bump

# #028 - Semantic Versioning Automation
# Automatically bumps version based on conventional commits when merging to master

on:
  push:
    branches:
      - master
      - main

jobs:
  bump-version:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_GENERAL || '["self-hosted","general"]') }}
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run version bump script
        id: bump
        run: |
          # Auto-bump apenas Android no merge a master. Web/iOS/functions sao
          # bumpados manualmente (versionamento independente por plataforma).
          node scripts/bump-version.js android

          # Check if version changed
          if git diff --quiet app/build.gradle.kts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            # Extract new version
            NEW_VERSION=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to branch + create PR
        id: push_pr
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v${{ steps.bump.outputs.version }}"
          BRANCH="chore/bump-version-${{ steps.bump.outputs.version }}"

          # Idempotência: se a tag já existe (local ou remoto), pula totalmente.
          # Master é protegido — push direto bloqueado por branch protection.
          # O bump é puramente informativo (build.gradle.kts), sem necessidade de commit.
          if git rev-parse "$TAG" >/dev/null 2>&1 || \
             git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "::warning::Tag $TAG já existe — pulando (master é protegido, push desnecessário)"
            echo "tag_skipped=true" >> $GITHUB_OUTPUT
          else
            git checkout -b "$BRANCH"
            git add app/build.gradle.kts versions.json
            git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
            git tag "$TAG"
            git push origin "$BRANCH" --tags
            gh pr create --base master --head "$BRANCH" \
              --title "chore: bump version to ${{ steps.bump.outputs.version }}" \
              --body "Auto-generated version bump from conventional commits. Tag: $TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.bump.outputs.changed == 'true' && steps.push_pr.outputs.tag_skipped != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Release v${{ steps.bump.outputs.version }}
          body: |
            ## What's Changed

            Auto-generated release from conventional commits.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto Version Bump

# #028 - Semantic Versioning Automation
# Automatically bumps version based on conventional commits when merging to master

on:
  push:
    branches:
      - master
      - main

jobs:
  bump-version:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    permissions:
      contents: write  # Para criar tags e commits

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run version bump script
        id: bump
        run: |
          node scripts/bump-version.js

          # Check if version changed
          if git diff --quiet app/build.gradle.kts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            # Extract new version
            NEW_VERSION=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Commit and tag
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v${{ steps.bump.outputs.version }}"

          # Idempotência: se a tag já existe (local ou remoto), pula tag/release
          # mas ainda commita o bump pra manter build.gradle.kts em sync.
          if git rev-parse "$TAG" >/dev/null 2>&1 || \
             git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "::warning::Tag $TAG já existe — pulando tag/push de tag (commitando bump apenas)"
            git add app/build.gradle.kts
            git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]" || echo "Nada a commitar"
            git push origin master || true
            echo "tag_skipped=true" >> $GITHUB_OUTPUT
          else
            git add app/build.gradle.kts
            git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
            git tag "$TAG"
            git push origin master --tags
          fi

      - name: Create GitHub Release
        if: steps.bump.outputs.changed == 'true' && steps.bump.outputs.tag_skipped != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Release v${{ steps.bump.outputs.version }}
          body: |
            ## What's Changed

            Auto-generated release from conventional commits.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

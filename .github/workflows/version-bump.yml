name: Prepare Android Version Bump

# Prepares a version PR only. Tags, GitHub Releases, and store publication must
# happen from the merged master commit through the documented release process.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment for Android
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: android-version-bump
  cancel-in-progress: false

# Menor privilégio: jobs que precisam de mais declaram permissions próprias.
permissions:
  contents: read

jobs:
  prepare-version-pr:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump Android version
        id: bump
        run: |
          node scripts/bump-version.js android "${{ inputs.bump }}"

          if git diff --quiet -- app/build.gradle.kts versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          BRANCH="chore/bump-android-$VERSION"
          TAG="android-v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Refusing to prepare a duplicate release."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists. Reuse or close its pull request first."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/build.gradle.kts versions.json
          git commit -m "chore(android): bump version to $VERSION"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --draft \
            --title "chore(android): prepare release $VERSION" \
            --body "$(printf '%s\n' \
              '## Summary' \
              '' \
              "Prepare Android $VERSION from the current master branch." \
              '' \
              '## Required before marking ready' \
              '' \
              '- Add release-notes/android/<version>.md.' \
              '- Run release-notes validate, changelog, and bundle.' \
              '- Run the Android release checks.' \
              '- Link the release issue.' \
              '' \
              'No tag or GitHub Release was created. Publish them only after this PR is green and merged.')"

      - name: Report unchanged version
        if: steps.bump.outputs.changed != 'true'
        run: echo "No Android version change was generated."

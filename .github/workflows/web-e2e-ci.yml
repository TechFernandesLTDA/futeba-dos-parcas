name: Web E2E CI (#2533)

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filtro opcional (ex: grupos.spec.ts)'
        required: false
        default: ''
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: firebase-emulator-integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  web-e2e:
    name: Web E2E — Emulador (auth+firestore+functions)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # NÃO definir FIREBASE_*_EMULATOR_HOST nem GCLOUD_PROJECT aqui:
      # no processo da CLI do firebase-tools essas variáveis fazem o hub
      # acreditar que os emuladores já estão rodando externamente e ele
      # nunca os inicia (nenhuma linha "+ auth: ... running" no log) —
      # crash silencioso histórico deste job. Elas são exportadas APENAS
      # dentro do script interno, para os seeds/globalSetup.
      VITE_TEST_PLAYER_EMAIL: test.player@futeba.test
      VITE_TEST_PLAYER_PASSWORD: Test123!@#
      VITE_TEST_FIELD_OWNER_EMAIL: test.fieldowner@futeba.test
      VITE_TEST_FIELD_OWNER_PASSWORD: Test123!@#
      VITE_TEST_ADMIN_EMAIL: test.admin@futeba.test
      VITE_TEST_ADMIN_PASSWORD: Test123!@#
      VITE_TEST_UNVERIFIED_EMAIL: test.unverified@futeba.test
      VITE_TEST_UNVERIFIED_PASSWORD: Test123!@#
      VITE_USE_EMULATOR: "true"
      # Config Firebase dummy para satisfazer verify-env.mjs no build E2E.
      # Em modo emulador (VITE_USE_EMULATOR=true) o SDK conecta nos emuladores,
      # então os valores reais são irrelevantes; só o projectId casa com o
      # GCLOUD_PROJECT do emulador Firestore. #2784
      # Projeto demo-*: emuladores 100% offline, sem busca de Admin SDK config
      # nem credenciais no runner (issue CI Web E2E, 03/10/2026).
      VITE_FIREBASE_API_KEY: "demo-api-key"
      VITE_FIREBASE_AUTH_DOMAIN: "futebadosparcas.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "demo-futebadosparcas"
      VITE_FIREBASE_STORAGE_BUCKET: "futebadosparcas.appspot.com"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Validar contratos dos workflows de emulador
        run: node --test scripts/ci/emulator-tools-workflow-contract.test.js scripts/web-e2e-workflow-contract.test.js

      - name: Instalar Firebase CLI + tsx (isolado por job)
        run: |
          tools_dir="$RUNNER_TEMP/futeba-ci-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          npm install \
            --prefix "$tools_dir" \
            --no-save \
            --package-lock=false \
            --no-audit \
            --no-fund \
            firebase-tools@15.23.0 \
            tsx@4.23.1
          printf '%s\n' "$tools_dir/node_modules/.bin" >> "$GITHUB_PATH"
          "$tools_dir/node_modules/.bin/firebase" --version
          "$tools_dir/node_modules/.bin/tsx" --version

      - name: Instalar dependências — functions
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Instalar dependências — web
        working-directory: web
        run: npm ci

      - name: Build web (modo emulador)
        # Pré-builda o app para ser servido por `vite preview` (estático, baixa
        # memória) durante os testes — evita o `vite dev` que estourava o runner
        # por OOM. O build roda ANTES dos emuladores (menor pico de memória) e
        # herda as VITE_* do job env (incluindo VITE_USE_EMULATOR=true). #2784
        working-directory: web
        run: npm run build -- --mode e2e

      - name: Instalar browsers Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Selecionar porta livre para o preview E2E
        run: node scripts/ci/allocate-web-e2e-port.js

      - name: E2E (emulador + seed + Playwright)
        timeout-minutes: 20
        # emulators:exec morria silenciosamente após 'Serving at port' em TODOS
        # os runs (exit 2, zero log — pipeline nunca passou desde 06/06). Aqui o
        # emulador sobe em background com log em arquivo: a espera de readiness
        # é pelo marcador oficial 'All emulators ready' e qualquer falha imprime
        # o log real do emulador. Kill por PID (o contrato proíbe pkill).
        run: |
          firebase emulators:start \
            --only auth,firestore,functions \
            --project demo-futebadosparcas \
            > "$RUNNER_TEMP/emu.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emu.pid"
          export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8085
          export FIREBASE_STORAGE_EMULATOR_HOST=127.0.0.1:9199
          export GCLOUD_PROJECT=demo-futebadosparcas
          ready=""
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" "$RUNNER_TEMP/emu.log" 2>/dev/null; then
              ready=sim
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "[e2e] emuladores não ficaram prontos em 120s — log:"
            tail -80 "$RUNNER_TEMP/emu.log"
            exit 1
          fi
          echo "[e2e] Emuladores prontos — seed..."
          NODE_PATH=functions/node_modules tsx scripts/seed-e2e-users.ts
          NODE_PATH=functions/node_modules tsx scripts/seed-e2e-groups.ts
          echo "[e2e] Seed OK — Playwright (vite preview via webServer config)..."
          set +e
          cd web && npx playwright test --project=chromium
          code=$?
          kill "$(cat "$RUNNER_TEMP/emu.pid")" 2>/dev/null || true
          echo "[e2e] playwright exit=$code"
          exit $code
        env:
          CI: "true"
          DEBUG: "pw:webserver"

      - name: Diagnóstico pós-morte (memória + OOM do kernel)
        if: always()
        run: |
          echo "[diag] trilha de memória (últimas 25 amostras):"
          tail -25 "$RUNNER_TEMP/mem-trace.log" 2>/dev/null || echo "(sem trilha)"
          echo "[diag] OOM/kill no kernel:"
          sudo dmesg 2>/dev/null | grep -iE "oom|killed process|out of memory" | tail -10 || echo "(sem entradas de OOM no dmesg)"

      - name: Upload — Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-e2e
          path: web/playwright-report/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9

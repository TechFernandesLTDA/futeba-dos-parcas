name: Web E2E CI (#2533)

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filtro opcional (ex: grupos.spec.ts)'
        required: false
        default: ''
  schedule:
    - cron: '0 8 * * *'

jobs:
  web-e2e:
    name: Web E2E — Emulador (auth+firestore+functions)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 60

    env:
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      GCLOUD_PROJECT: futebadosparcas
      VITE_TEST_PLAYER_EMAIL: test.player@futeba.test
      VITE_TEST_PLAYER_PASSWORD: Test123!@#
      VITE_TEST_FIELD_OWNER_EMAIL: test.fieldowner@futeba.test
      VITE_TEST_FIELD_OWNER_PASSWORD: Test123!@#
      VITE_TEST_ADMIN_EMAIL: test.admin@futeba.test
      VITE_TEST_ADMIN_PASSWORD: Test123!@#
      VITE_USE_EMULATOR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar Firebase CLI + tsx
        run: npm install -g firebase-tools tsx

      - name: Instalar dependências — functions
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Instalar dependências — web
        working-directory: web
        run: npm ci

      - name: Instalar browsers Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E (emulador + seed + Playwright)
        # emulators:exec sobe/derruba emuladores automaticamente.
        # O script inline faz seed e roda Playwright (webServer = vite dev).
        run: |
          firebase emulators:exec \
            --only auth,firestore,functions \
            --project futebadosparcas \
            'bash -c "
              set -e
              echo \"[e2e] Emuladores prontos — seed...\"
              NODE_PATH=functions/node_modules tsx scripts/seed-e2e-users.ts
              NODE_PATH=functions/node_modules tsx scripts/seed-e2e-groups.ts
              echo \"[e2e] Seed OK — Playwright (vite dev via webServer config)...\"
              cd web && npx playwright test --project=chromium
            "'
        env:
          CI: "true"

      - name: Upload — Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-e2e
          path: web/playwright-report/
          retention-days: 7

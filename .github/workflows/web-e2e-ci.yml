name: Web E2E CI (#2533)

on:
  pull_request:
    branches: [master, develop]
    paths:
      - "web/**"
      - "functions/**"
      - "firestore.rules"
      - ".github/workflows/web-e2e-ci.yml"

jobs:
  web-e2e:
    name: Web E2E — Emulador (auth+firestore+functions)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30

    env:
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      GCLOUD_PROJECT: futebadosparcas
      VITE_TEST_PLAYER_EMAIL: test.player@futeba.test
      VITE_TEST_PLAYER_PASSWORD: Test123!@#
      VITE_TEST_FIELD_OWNER_EMAIL: test.fieldowner@futeba.test
      VITE_TEST_FIELD_OWNER_PASSWORD: Test123!@#
      VITE_TEST_ADMIN_EMAIL: test.admin@futeba.test
      VITE_TEST_ADMIN_PASSWORD: Test123!@#
      VITE_USE_EMULATOR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json

      - name: Configurar Java 21 (requerido pelo emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar dependências — functions
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Instalar dependências — web
        working-directory: web
        run: npm ci

      - name: Instalar browsers Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build web app
        working-directory: web
        run: npm run build
        env:
          VITE_USE_EMULATOR: "true"
          VITE_FIREBASE_API_KEY: fake-api-key
          VITE_FIREBASE_AUTH_DOMAIN: 127.0.0.1:9099
          VITE_FIREBASE_PROJECT_ID: futebadosparcas
          VITE_FIREBASE_STORAGE_BUCKET: futebadosparcas.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"

      - name: Seed — usuários E2E
        run: npx tsx scripts/seed-e2e-users.ts
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085

      - name: Seed — grupos E2E
        run: npx tsx scripts/seed-e2e-groups.ts
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085

      - name: Iniciar emuladores
        run: |
          firebase emulators:start \
            --only auth,firestore,functions \
            --project futebadosparcas &
          echo "EMULATOR_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:9099 > /dev/null 2>&1 && break
            sleep 2
          done
        continue-on-error: false

      - name: Testes — Web E2E (Playwright)
        working-directory: web
        run: |
          npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173

      - name: Upload — Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-e2e
          path: web/playwright-report/
          retention-days: 7

      - name: Stop emulator (cleanup)
        if: always()
        run: |
          firebase emulators:stop 2>/dev/null || true
          pkill -f "firebase.*emulator" 2>/dev/null || true

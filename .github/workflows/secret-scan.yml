name: "Secret Scan (gitleaks)"

# Substitui o Secret Protection pago do GitHub Advanced Security.
# Usa o BINÁRIO CLI oficial do gitleaks (MIT, gratuito): a gitleaks-action v2
# exige licença paga para repositórios de organização, o binário não.
# Configuração e allowlist auditada: .gitleaks.toml na raiz.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]
  schedule:
    # Semanal — segunda-feira 06:00 UTC: varredura de TODO o histórico (safety net).
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    # Roda no runner self-hosted (Mac ARM) ou em Linux hospedado; o binário de
    # cada plataforma é fixo e verificado por sha256 abaixo.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      # Checksums de gitleaks_8.30.1_checksums.txt da release oficial.
      GITLEAKS_SHA256_LINUX_X64: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      GITLEAKS_SHA256_LINUX_ARM64: 'e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080'
      GITLEAKS_SHA256_DARWIN_ARM64: 'b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5'

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) platform=linux_x64; sha="$GITLEAKS_SHA256_LINUX_X64" ;;
            Linux-aarch64) platform=linux_arm64; sha="$GITLEAKS_SHA256_LINUX_ARM64" ;;
            Darwin-arm64) platform=darwin_arm64; sha="$GITLEAKS_SHA256_DARWIN_ARM64" ;;
            *) echo "::error::Plataforma sem binário fixado: $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${platform}.tar.gz"
          curl -sSfL "$url" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          # shasum existe no macOS e no Linux; sha256sum só no Linux.
          echo "${sha}  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      # PR: só os commits novos (base..head). Push/cron/manual: histórico inteiro.
      # --redact: o valor do segredo nunca aparece em log nem no relatório.
      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          args=(detect --source . --config .gitleaks.toml --redact --no-banner
                --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" "${args[@]}"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks encontrou possíveis segredos (exit=$status). Valores redigidos; veja o artifact gitleaks-report. Falso positivo: ajuste a allowlist em .gitleaks.toml."
          fi
          exit "$status"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

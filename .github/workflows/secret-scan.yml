name: "Secret Scan (gitleaks)"

# Substitui o Secret Protection pago do GitHub Advanced Security.
# Usa o BINÁRIO CLI oficial do gitleaks (MIT, gratuito): a gitleaks-action v2
# exige licença paga para repositórios de organização, o binário não.
# Configuração e allowlist auditada: .gitleaks.toml na raiz.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]
  schedule:
    # Semanal — segunda-feira 06:00 UTC: varredura de TODO o histórico (safety net).
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    # Linux hospedado: o binário linux_x64 é fixo e verificado por sha256 abaixo.
    # Job curto (~1 min), cabe folgado nos minutos gratuitos do plano Free.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      # PR: só os commits novos (base..head). Push/cron/manual: histórico inteiro.
      # --redact: o valor do segredo nunca aparece em log nem no relatório.
      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          args=(detect --source . --config .gitleaks.toml --redact --no-banner
                --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" "${args[@]}"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks encontrou possíveis segredos (exit=$status). Valores redigidos; veja o artifact gitleaks-report. Falso positivo: ajuste a allowlist em .gitleaks.toml."
          fi
          exit "$status"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

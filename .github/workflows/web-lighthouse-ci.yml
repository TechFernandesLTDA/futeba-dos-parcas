name: Web Lighthouse CI

on:
  push:
    branches: [ master ]
    paths:
      - 'web/**'
      - '.github/workflows/web-lighthouse-ci.yml'
      - 'scripts/web-ci-workflow-contract.test.js'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Cancela execuções anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: web

jobs:
  # Em PR, só roda Lighthouse quando há mudança em Web (check continua reportado como skipped).
  changes:
    name: Classify changes
    uses: ./.github/workflows/change-scope.yml

  lighthouse:
    name: Lighthouse CI
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    # Lighthouse precisa de um navegador Linux (Chromium do Playwright). Roda nos
    # runners Linux do WSL (deps do Playwright já instaladas); não reutilizar o
    # Chrome Windows exposto por interop WSL.
    runs-on: ${{ fromJSON((contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.RUNNER_LABELS_HEAVY || '["ubuntu-24.04"]') || '"ubuntu-24.04"') }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect web-relevant changes
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('should_run', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const isWebRelevantPath = (filename) =>
              typeof filename === 'string' && (
                filename.startsWith('web/') ||
                filename === '.github/workflows/web-lighthouse-ci.yml' ||
                filename === 'scripts/web-ci-workflow-contract.test.js'
              );
            const shouldRun = files.some((file) =>
              isWebRelevantPath(file.filename) ||
              isWebRelevantPath(file.previous_filename)
            );
            core.setOutput('should_run', shouldRun ? 'true' : 'false');

      - name: Setup Node.js
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Verify Web CI contracts
        if: steps.changes.outputs.should_run == 'true'
        run: node --test ../scripts/web-ci-workflow-contract.test.js

      - name: Install dependencies
        if: steps.changes.outputs.should_run == 'true'
        env:
          NPM_CONFIG_PRODUCTION: 'false'
        run: npm ci --legacy-peer-deps --include=dev

      - name: Install and select Linux Chromium
        if: steps.changes.outputs.should_run == 'true'
        run: |
          # LHCI passes --no-sandbox from web/.lighthouserc.cjs to this Linux browser.
          # The flag is required by the runner environment and does not alter metrics.
          npx playwright install chromium
          printf 'CHROME_PATH=%s\n' "$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Verify Lighthouse toolchain
        if: steps.changes.outputs.should_run == 'true'
        run: |
          test -x node_modules/.bin/vite
          test -x node_modules/.bin/lhci
          ./node_modules/.bin/vite --version
          ./node_modules/.bin/lhci --version

      - name: Build
        if: steps.changes.outputs.should_run == 'true'
        run: npm run build

      - name: Run Lighthouse CI
        if: steps.changes.outputs.should_run == 'true'
        run: npm run lighthouse

      - name: Skip Lighthouse for non-web PRs
        if: steps.changes.outputs.should_run != 'true'
        run: |
          echo "Lighthouse CI pulado para PR sem mudancas em web/."

      - name: Upload Lighthouse results
        if: always() && steps.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: web/.lighthouseci/
          retention-days: 14

name: Web Lighthouse CI

on:
  push:
    branches: [ master ]
    paths:
      - 'web/**'
      - '.github/workflows/web-lighthouse-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'web/**'
      - '.github/workflows/web-lighthouse-ci.yml'
  workflow_dispatch:

# Cancela execuções anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        env:
          NPM_CONFIG_PRODUCTION: 'false'
        run: npm ci --legacy-peer-deps --include=dev

      - name: Verify Lighthouse toolchain
        run: |
          test -x node_modules/.bin/vite
          test -x node_modules/.bin/lhci
          ./node_modules/.bin/vite --version
          ./node_modules/.bin/lhci --version

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: web/.lighthouseci/
          retention-days: 14

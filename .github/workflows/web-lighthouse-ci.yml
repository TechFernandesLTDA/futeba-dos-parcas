name: Web Lighthouse CI

on:
  push:
    branches: [ master ]
    paths:
      - 'web/**'
      - '.github/workflows/web-lighthouse-ci.yml'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Cancela execuções anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect web-relevant changes
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('should_run', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const shouldRun = files.some((file) =>
              file.filename.startsWith('web/') ||
              file.filename === '.github/workflows/web-lighthouse-ci.yml'
            );
            core.setOutput('should_run', shouldRun ? 'true' : 'false');

      - name: Setup Node.js
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.should_run == 'true'
        env:
          NPM_CONFIG_PRODUCTION: 'false'
        run: npm ci --legacy-peer-deps --include=dev

      - name: Verify Lighthouse toolchain
        if: steps.changes.outputs.should_run == 'true'
        run: |
          test -x node_modules/.bin/vite
          test -x node_modules/.bin/lhci
          ./node_modules/.bin/vite --version
          ./node_modules/.bin/lhci --version

      - name: Build
        if: steps.changes.outputs.should_run == 'true'
        run: npm run build

      - name: Run Lighthouse CI
        if: steps.changes.outputs.should_run == 'true'
        run: npm run lighthouse

      - name: Skip Lighthouse for non-web PRs
        if: steps.changes.outputs.should_run != 'true'
        run: |
          echo "Lighthouse CI pulado para PR sem mudancas em web/."

      - name: Upload Lighthouse results
        if: always() && steps.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: web/.lighthouseci/
          retention-days: 14

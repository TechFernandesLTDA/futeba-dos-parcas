name: Web Lighthouse CI

on:
  push:
    branches: [ master ]
    paths:
      - 'web/**'
      - '.github/workflows/web-lighthouse-ci.yml'
      - 'scripts/web-ci-workflow-contract.test.js'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Cancela execuções anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: web

jobs:
  lighthouse:
    name: Lighthouse CI
    # PRs, pushes e execuções manuais usam os runners Apple Silicon dedicados.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect web-relevant changes
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('should_run', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const isWebRelevantPath = (filename) =>
              typeof filename === 'string' && (
                filename.startsWith('web/') ||
                filename === '.github/workflows/web-lighthouse-ci.yml' ||
                filename === 'scripts/web-ci-workflow-contract.test.js'
              );
            const shouldRun = files.some((file) =>
              isWebRelevantPath(file.filename) ||
              isWebRelevantPath(file.previous_filename)
            );
            core.setOutput('should_run', shouldRun ? 'true' : 'false');

      - name: Setup Node.js
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Verify Web CI contracts
        if: steps.changes.outputs.should_run == 'true'
        run: node --test ../scripts/web-ci-workflow-contract.test.js

      - name: Install dependencies
        if: steps.changes.outputs.should_run == 'true'
        env:
          NPM_CONFIG_PRODUCTION: 'false'
        run: npm ci --legacy-peer-deps --include=dev

      - name: Verify Lighthouse toolchain
        if: steps.changes.outputs.should_run == 'true'
        run: |
          test -x node_modules/.bin/vite
          test -x node_modules/.bin/lhci
          ./node_modules/.bin/vite --version
          ./node_modules/.bin/lhci --version

      - name: Build
        if: steps.changes.outputs.should_run == 'true'
        run: npm run build

      - name: Runner hygiene (porta do preview + perfis Chrome órfãos)
        if: steps.changes.outputs.should_run == 'true'
        run: |
          # Processo órfão na porta 4173 (vazamento de execução anterior) faz o
          # vite preview pular de porta e o LHCI auditar o servidor errado.
          if command -v lsof &>/dev/null; then
            PIDS="$(lsof -t -i tcp:4173 2>/dev/null || true)"
            if [ -n "$PIDS" ]; then
              echo "Matando processo(s) órfão(s) na porta 4173: $PIDS"
              kill -9 $PIDS 2>/dev/null || true
            fi
          elif command -v fuser &>/dev/null; then
            fuser -k 4173/tcp 2>/dev/null || true
          fi
          # Perfis temporários órfãos do chrome-launcher travam o Chrome
          # (ProcessSingleton) em execuções consecutivas no mesmo runner.
          rm -rf "${TMPDIR:-/tmp}"/lighthouse.* 2>/dev/null || true

      - name: Run Lighthouse CI
        if: steps.changes.outputs.should_run == 'true'
        run: npm run lighthouse

      - name: Skip Lighthouse for non-web PRs
        if: steps.changes.outputs.should_run != 'true'
        run: |
          echo "Lighthouse CI pulado para PR sem mudancas em web/."

      - name: Upload Lighthouse results
        if: always() && steps.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: web/.lighthouseci/
          retention-days: 14

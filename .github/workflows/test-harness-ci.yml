name: Test Harness CI (#2533)

# CI Job que executa a suite de testes de INTEGRAÇÃO Jest (functions)
# contra emuladores Firebase (auth + firestore + functions).
#
# Valida:
#   - Domínio Grupos: discover, preview público, invite-join (#2530)
#   - Functions integration: onInviteRedeemed + member-counter (#2531)
#
# NOTA (#2782): os emuladores são iniciados via `firebase emulators:exec`,
# que sobe/derruba auth+firestore+functions automaticamente e roda o seed
# + Jest no MESMO processo. Antes, os steps de seed/jest eram separados e
# NENHUM step iniciava os emuladores → o seed batia em 127.0.0.1:9099 sem
# nada escutando (ECONNREFUSED) e o workflow nunca passava.
# Os testes E2E de Playwright vivem no workflow dedicado web-e2e-ci.yml —
# não duplicar aqui (evita rodar 2x e reduz pressão de memória no runner).
#
# Disparo: manual (workflow_dispatch) + schedule diário.

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filtro opcional de testes (--testPathPatterns para Jest)'
        required: false
        default: ''
  schedule:
    # Executa diariamente às 5h BRT (8h UTC) para detectar regressões
    - cron: '0 8 * * *'

concurrency:
  group: firebase-emulator-integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test-harness:
    name: Test Harness — Functions Integration (Emulador)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30

    env:
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      GCLOUD_PROJECT: futebadosparcas
      # Credenciais dos usuários E2E (mesmas usadas pelo seed-e2e-users.ts)
      VITE_TEST_PLAYER_EMAIL: test.player@futeba.test
      VITE_TEST_PLAYER_PASSWORD: Test123!@#
      VITE_TEST_FIELD_OWNER_EMAIL: test.fieldowner@futeba.test
      VITE_TEST_FIELD_OWNER_PASSWORD: Test123!@#
      VITE_TEST_ADMIN_EMAIL: test.admin@futeba.test
      VITE_TEST_ADMIN_PASSWORD: Test123!@#
      VITE_USE_EMULATOR: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Configurar Java 21 (requerido pelo emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validar contratos dos workflows de emulador
        run: node --test scripts/ci/emulator-tools-workflow-contract.test.js scripts/web-e2e-workflow-contract.test.js

      - name: Instalar Firebase CLI + tsx (isolado por job)
        run: |
          tools_dir="$RUNNER_TEMP/futeba-ci-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          npm install \
            --prefix "$tools_dir" \
            --no-save \
            --package-lock=false \
            --no-audit \
            --no-fund \
            firebase-tools@15.23.0 \
            tsx@4.23.1
          printf '%s\n' "$tools_dir/node_modules/.bin" >> "$GITHUB_PATH"
          "$tools_dir/node_modules/.bin/firebase" --version
          "$tools_dir/node_modules/.bin/tsx" --version

      - name: Instalar dependências — functions
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      # ------------------------------------------
      # SEED + FUNCTIONS INTEGRATION (com emulador ativo)
      # ------------------------------------------

      - name: Seed + Functions Integration (emulador)
        # emulators:exec sobe/derruba auth+firestore+functions automaticamente.
        # Seed e Jest rodam no MESMO processo, com os emuladores ATIVOS — sem
        # isso o seed falhava com ECONNREFUSED (#2782).
        run: |
          firebase emulators:exec \
            --only auth,firestore,functions \
            --project futebadosparcas \
            'bash -c "
              set -e
              echo \"[harness] Emuladores prontos — seed...\"
              NODE_PATH=functions/node_modules tsx scripts/seed-e2e-users.ts
              NODE_PATH=functions/node_modules tsx scripts/seed-e2e-groups.ts
              echo \"[harness] Seed OK — Jest integration...\"
              cd functions && npx jest --config jest.integration.config.js --no-coverage --verbose
            "'
        env:
          CI: 'true'

      # ------------------------------------------
      # RESULTADOS
      # ------------------------------------------

      - name: Upload — Jest results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-integration-results
          path: functions/test-results/
          retention-days: 7

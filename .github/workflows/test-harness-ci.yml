name: Test Harness CI (#2533)

# CI Job que executa a suite completa de testes de integração/E2E
# contra emuladores Firebase (firestore + auth + functions).
#
# Valida:
#   - Domínio Grupos: discover, preview público, invite-join (#2530)
#   - Functions integration: onInviteRedeemed + member-counter (#2531)
#   - Web E2E: discover, preview, invite-join via Playwright (#2532)
#
# Disparo: manual (workflow_dispatch) — não roda em PRs automaticamente
# por ser mais pesado e exigir emuladores completos.

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filtro opcional de testes (--grep para Playwright, --testPathPattern para Jest)'
        required: false
        default: ''
  schedule:
    # Executa diariamente às 5h BRT (8h UTC) para detectar regressões
    - cron: '0 8 * * *'

jobs:
  test-harness:
    name: Test Harness — Emulador Full-Stack
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30

    env:
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      GCLOUD_PROJECT: futebadosparcas
      # Credenciais dos usuários E2E (mesmas usadas pelo seed-e2e-users.ts)
      VITE_TEST_PLAYER_EMAIL: test.player@futeba.test
      VITE_TEST_PLAYER_PASSWORD: Test123!@#
      VITE_TEST_FIELD_OWNER_EMAIL: test.fieldowner@futeba.test
      VITE_TEST_FIELD_OWNER_PASSWORD: Test123!@#
      VITE_TEST_ADMIN_EMAIL: test.admin@futeba.test
      VITE_TEST_ADMIN_PASSWORD: Test123!@#
      VITE_USE_EMULATOR: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json

      - name: Configurar Java 21 (requerido pelo emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      # ------------------------------------------
      # INSTALAÇÃO DE DEPENDÊNCIAS
      # ------------------------------------------

      - name: Instalar dependências — functions
        working-directory: functions
        run: npm ci

      - name: Instalar dependências — web
        working-directory: web
        run: npm ci

      - name: Instalar browsers Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      # ------------------------------------------
      # BUILD (para E2E web)
      # ------------------------------------------

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Build web app
        working-directory: web
        run: npm run build
        env:
          VITE_USE_EMULATOR: 'true'
          VITE_FIREBASE_API_KEY: fake-api-key
          VITE_FIREBASE_AUTH_DOMAIN: 127.0.0.1:9099
          VITE_FIREBASE_PROJECT_ID: futebadosparcas
          VITE_FIREBASE_STORAGE_BUCKET: futebadosparcas.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'

      # ------------------------------------------
      # SEED DE DADOS E2E
      # ------------------------------------------

      - name: Seed — usuários E2E
        run: npx tsx scripts/seed-e2e-users.ts
        env:
          NODE_PATH: functions/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085

      - name: Seed — grupos E2E
        run: npx tsx scripts/seed-e2e-groups.ts
        env:
          NODE_PATH: functions/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085

      # ------------------------------------------
      # FUNCTIONS INTEGRATION TESTS
      # ------------------------------------------

      - name: Testes — Functions Integration
        working-directory: functions
        run: |
          npx jest --config jest.integration.config.js --no-coverage --verbose
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085

      # ------------------------------------------
      # WEB E2E TESTS
      # ------------------------------------------

      - name: Iniciar servidor web (background)
        working-directory: web
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          echo "PID=$!" >> $GITHUB_ENV
          # Aguarda o servidor estar pronto
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:4173 > /dev/null && break
            sleep 2
          done

      - name: Testes — Web E2E (Playwright)
        working-directory: web
        run: |
          npx playwright test --project=chromium --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085

      # ------------------------------------------
      # RESULTADOS
      # ------------------------------------------

      - name: Upload — Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload — Jest results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-integration-results
          path: functions/test-results/
          retention-days: 7

      # ------------------------------------------
      # CLEANUP
      # ------------------------------------------

      - name: Stop emulator (cleanup)
        if: always()
        run: |
          # Mata qualquer processo residual do emulador
          pkill -f "firebase.*emulator" 2>/dev/null || true

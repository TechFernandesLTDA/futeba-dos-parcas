name: Deploy Beta to Firebase App Distribution

# #065 - Firebase App Distribution for Beta Testing
# Automatically deploys to Firebase when pushing to develop or via manual trigger

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Allow manual trigger

# Menor privilégio: jobs que precisam de mais declaram permissions próprias.
permissions:
  contents: read

# Deploys nunca são cancelados no meio; execuções do mesmo ref entram em fila.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-beta:
    name: Build & Deploy Beta
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || '["self-hosted","Linux","X64","futeba-general"]') }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          test -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-37.0/android.jar"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties with signing config
        env:
          # Senhas em base64 pra evitar shell expansion de $ chars.
          KEYSTORE_PASSWORD_B64: ${{ secrets.KEYSTORE_PASSWORD_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_B64: ${{ secrets.KEY_PASSWORD_B64 }}
        run: |
          STORE_PW=$(printf '%s' "$KEYSTORE_PASSWORD_B64" | base64 --decode)
          KEY_PW=$(printf '%s' "$KEY_PASSWORD_B64" | base64 --decode)
          {
            printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            printf 'STORE_FILE=%s/release.jks\n' "$RUNNER_TEMP"
            printf 'STORE_PASSWORD=%s\n' "$STORE_PW"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PW"
          } > local.properties

      - name: Decode and save keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" && echo "✓ keystore written ($(wc -c < "$RUNNER_TEMP/release.jks") bytes)" || (echo "✗ empty keystore"; exit 1)

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          # printf '%s' preserva multi-line JSON com chars especiais.
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Format release notes
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '🚀 New Beta Build Available!\n\n' > /tmp/release-notes.txt
          printf '**Version:** %s\n' "${{ github.ref_name }}" >> /tmp/release-notes.txt
          printf '**Commit:** %s\n' "${{ github.sha }}" >> /tmp/release-notes.txt
          printf '**Author:** %s\n\n' "${{ github.actor }}" >> /tmp/release-notes.txt
          printf 'Changes in this build:\n' >> /tmp/release-notes.txt
          printf '%s\n' "$COMMIT_MSG" >> /tmp/release-notes.txt

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --project futebadosparcas \
            --groups beta-testers \
            --release-notes-file /tmp/release-notes.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Send Slack notification (optional)
        if: success()
        run: |
          # Uncomment if you have SLACK_WEBHOOK_URL secret configured
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"✅ Beta build deployed to Firebase App Distribution!"}'
          echo "Beta deployment successful!"

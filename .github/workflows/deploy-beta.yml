name: Deploy Beta to Firebase App Distribution

# #065 - Firebase App Distribution for Beta Testing
# Automatically deploys to Firebase when pushing to develop or via manual trigger

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-beta:
    name: Build & Deploy Beta
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties with signing config
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Passar via env evita shell injection em senhas com chars especiais.
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "STORE_FILE=$KEYSTORE_PATH"
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - name: Decode and save keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
        run: |
          # base64 --decode e portavel entre macOS (BSD) e Linux (GNU coreutils).
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          # printf '%s' preserva multi-line JSON com chars especiais.
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: beta-testers
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            🚀 New Beta Build Available!

            **Version:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}

            Changes in this build:
            ${{ github.event.head_commit.message }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Send Slack notification (optional)
        if: success()
        run: |
          # Uncomment if you have SLACK_WEBHOOK_URL secret configured
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"✅ Beta build deployed to Firebase App Distribution!"}'
          echo "Beta deployment successful!"

name: Web CI

on:
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
      - 'scripts/web-ci-workflow-contract.test.js'
      - 'scripts/ci/verify-vitest-shards.js'
      - 'scripts/ci/verify-vitest-shards.test.js'
  workflow_dispatch:
  # Cron noturno (03:00 UTC) — dispara apenas o job de mutation testing.
  # Os jobs de PR/push (quality/tests) são desativados no schedule
  # via `if` para não rodar à toa nos runners self-hosted.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  changes:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/change-scope.yml

  # Dois shards usam duas VMs efêmeras no PR e exatamente dois npm ci. O shard 1
  # também cobre lint/TypeScript/build para manter o caminho Web em duas lanes.
  web_shards:
    name: Web ${{ matrix.lane }}
    needs: [changes]
    if: github.event_name != 'schedule' && needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 1
            shard_total: 2
            lane: Quality + Tests (1/2)
            run_quality: true
          - shard_index: 2
            shard_total: 2
            lane: Tests (2/2)
            run_quality: false
    # PRs executam código npm não confiável em runners efêmeros.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || (vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]')) }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Verify Web CI contract
        if: matrix.run_quality
        run: node --test ../scripts/web-ci-workflow-contract.test.js ../scripts/ci/verify-vitest-shards.test.js

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        if: matrix.run_quality
        run: npm run lint

      - name: TypeScript and production build
        if: matrix.run_quality
        run: npm run build

      - name: Run Vitest shard
        run: >-
          npm test --
          --pool=threads
          --maxWorkers=2
          --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }}
          --reporter=default
          --reporter=json
          --outputFile.json=reports/vitest/shard-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}.json

      - name: Upload Vitest shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-vitest-shard-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}
          path: web/reports/vitest/shard-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}.json
          if-no-files-found: warn
          retention-days: 7

  web_gate:
    name: Web CI Gate
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [changes, web_shards]
    # O gate executa o verificador vindo do PR, portanto também deve ser efêmero.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || (vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]')) }}
    timeout-minutes: 5
    steps:
      - name: Checkout code
        if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Vitest shard reports
        if: needs.changes.outputs.web == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: web-vitest-shard-*-of-2
          path: reports/vitest
          merge-multiple: true

      - name: Verify complete Vitest suite
        if: needs.changes.outputs.web == 'true'
        working-directory: .
        env:
          WEB_SHARDS_RESULT: ${{ needs.web_shards.result }}
        run: node scripts/ci/verify-vitest-shards.js reports/vitest

      - name: Accept non-Web change
        if: needs.changes.outputs.web != 'true'
        working-directory: .
        run: echo "No Web impact; Web CI Gate passed without running npm code."

  # Mutation testing (Stryker) — mede o SINAL dos testes (mutation score) no
  # core de utils/services. Roda apenas no cron noturno e via workflow_dispatch,
  # NUNCA em PR/push, pois é mais lento e relatório-apenas (thresholds.break=null).
  mutation:
    name: Mutation Testing (Stryker)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run mutation testing
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: web/reports/mutation/
          retention-days: 14

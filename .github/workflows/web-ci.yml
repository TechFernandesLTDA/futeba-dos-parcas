name: Web CI

on:
  pull_request:
    branches: [master, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
      - 'scripts/web-ci-workflow-contract.test.js'
  push:
    branches: [master, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
      - 'scripts/web-ci-workflow-contract.test.js'
  workflow_dispatch:
  # Cron noturno (03:00 UTC) — dispara apenas o job de mutation testing.
  # Os jobs de PR/push (quality/tests) são desativados no schedule
  # via `if` para não rodar à toa nos runners self-hosted.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  # Uma única instalação cobre lint, TypeScript e o build de produção. O script
  # `npm run build` já executa o compilador TypeScript antes do Vite.
  web-quality:
    name: Web Quality
    if: github.event_name != 'schedule'
    # PRs executam código npm não confiável em runner efêmero.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || (vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]')) }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Verify Web CI contract
        run: node --test ../scripts/web-ci-workflow-contract.test.js

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript and production build
        run: npm run build

  web-tests:
    name: Web Tests
    if: github.event_name != 'schedule'
    # Push/manual podem reutilizar o Mac; PR nunca recebe o runner persistente.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || (vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]')) }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest suite
        run: npm test

  # Mutation testing (Stryker) — mede o SINAL dos testes (mutation score) no
  # core de utils/services. Roda apenas no cron noturno e via workflow_dispatch,
  # NUNCA em PR/push, pois é mais lento e relatório-apenas (thresholds.break=null).
  mutation:
    name: Mutation Testing (Stryker)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run mutation testing
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: web/reports/mutation/
          retention-days: 14

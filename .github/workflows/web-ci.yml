name: Web CI

on:
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
      - 'scripts/web-ci-workflow-contract.test.js'
      - 'scripts/ci/verify-vitest-shards.js'
      - 'scripts/ci/verify-vitest-shards.test.js'
      - 'scripts/ci/vitest-shard-plan.js'
      - 'scripts/ci/run-vitest-shard.js'
  workflow_dispatch:
    inputs:
      run_mutation:
        description: 'Executar também o Stryker (lento, ocupa um runner por muito tempo)'
        type: boolean
        default: false
  # Cron noturno (03:00 UTC) — dispara apenas o job de mutation testing.
  # Os jobs de PR/push (quality/tests) são desativados no schedule
  # via `if` para não rodar à toa nos runners self-hosted.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  changes:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/change-scope.yml

  # Dois shards usam os dois runners Mac do repositório e exatamente dois npm ci. O shard 1
  # também cobre lint/TypeScript/build para manter o caminho Web em duas lanes.
  web_shards:
    name: Web ${{ matrix.lane }}
    needs: [changes]
    if: github.event_name != 'schedule' && needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 1
            shard_total: 2
            lane: Quality + Tests (1/2)
            run_quality: true
          - shard_index: 2
            shard_total: 2
            lane: Tests (2/2)
            run_quality: false
    # O repositório usa runners Apple Silicon dedicados também para PRs internos.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Verify Web CI contract
        if: matrix.run_quality
        run: node --test ../scripts/web-ci-workflow-contract.test.js ../scripts/ci/verify-vitest-shards.test.js

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        if: matrix.run_quality
        run: npm run lint

      - name: TypeScript and production build
        if: matrix.run_quality
        run: npm run build

      - name: Run Vitest shard
        run: >-
          node ../scripts/ci/run-vitest-shard.js
          ${{ matrix.shard_index }}
          ${{ matrix.shard_total }}
          reports/vitest/shard-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}.json

      - name: Verify Vitest shard coverage
        run: >-
          node ../scripts/ci/verify-vitest-shards.js
          reports/vitest/shard-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}.json
          ${{ matrix.shard_index }}
          ${{ matrix.shard_total }}

  web_gate:
    name: Web CI Gate
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [changes, web_shards]
    # O gate agrega needs.*.result no mesmo pool de runners do restante do CI.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 5
    steps:
      - name: Enforce classified Web result
        working-directory: .
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.changes.result }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          WEB_SHARDS_RESULT: ${{ needs.web_shards.result }}
        run: |
          if [ "$CHANGE_SCOPE_RESULT" != "success" ]; then
            echo "Web change classifier finished with result: $CHANGE_SCOPE_RESULT" >&2
            exit 1
          fi
          if [ "$WEB_CHANGED" = "true" ]; then
            if [ "$WEB_SHARDS_RESULT" != "success" ]; then
              echo "Web shards finished with result: $WEB_SHARDS_RESULT" >&2
              exit 1
            fi
            echo "Both Web shards passed their exact local coverage contracts."
          else
            if [ "$WEB_SHARDS_RESULT" != "skipped" ]; then
              echo "Non-Web change unexpectedly ran shards: $WEB_SHARDS_RESULT" >&2
              exit 1
            fi
            echo "No Web impact; Web CI Gate passed without running npm code."
          fi

  # Mutation testing (Stryker) — mede o SINAL dos testes (mutation score) no
  # core de utils/services. Roda apenas no cron noturno e no workflow_dispatch
  # com run_mutation=true, NUNCA em PR/push nem em dispatch comum: é lento e
  # segura um runner Linux compartilhado por muito tempo. O threshold do
  # stryker.conf.json (break=60) continua valendo e faz o job falhar.
  mutation:
    name: Mutation Testing (Stryker)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mutation)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run mutation testing
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        # O Stryker acima continua autoritativo. Cota de artifacts indisponível
        # não deve transformar um mutation test bem-sucedido em falha do job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: web/reports/mutation/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9

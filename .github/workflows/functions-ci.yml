name: Cloud Functions CI

on:
  push:
    branches: [ master ]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-ci.yml'
  # Mutation testing roda apenas no schedule noturno (caro demais por PR).
  # O job `mutation` abaixo e gated por `if:` para nao rodar em push/PR.
  schedule:
    - cron: '0 4 * * *' # Todo dia as 04:00 UTC (~01:00 BRT)
  workflow_dispatch:

# Cancela execucoes anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: functions

jobs:
  build:
    name: Build TypeScript
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  lint:
    name: ESLint Check
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 15
    needs: [ build ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functions-coverage
          path: functions/coverage/
          retention-days: 14

  firestore-query-perf:
    name: Firestore Query Performance
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 20
    needs: [ build ]
    # Tests perf são experimentais — ESM modules de @google-cloud/firestore
    # quebram com ts-jest default. Marcar non-blocking até ajustar transform.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # firebase-tools >= 13.x requer JDK 21+ pro Firestore emulator.
      # Runner default tem JDK 17 → emulator fail. Setup explícito.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI (se ausente)
        run: |
          if ! command -v firebase &> /dev/null; then
            npm install -g firebase-tools
          fi
          firebase --version

      # FIX #1282-CI: runners macOS self-hosted reutilizam o mesmo processo
      # entre runs. Emuladores de um run anterior podem manter as portas
      # ocupadas → "Could not start Firestore Emulator, port taken".
      # Matar qualquer processo nas portas dos emuladores antes de iniciar
      # (lsof -ti retorna PIDs; || true garante que o step nunca falha
      # mesmo que a porta já esteja livre).
      - name: Liberar portas dos emuladores (cleanup stale processes)
        run: lsof -ti:8085,9099,9199,4000,5001 | xargs kill -9 2>/dev/null || true
        working-directory: .

      - name: Run Firestore Query Performance Tests
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8085"
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-perf-test \
            'cd functions && npm run test:perf'
        working-directory: .

  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    # Caro: roda apenas no schedule noturno ou disparo manual — NUNCA em push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Mutation Tests
        run: npm run test:mutation

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functions-mutation-report
          path: functions/reports/mutation/
          retention-days: 14

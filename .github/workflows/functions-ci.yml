name: Cloud Functions CI

on:
  push:
    branches: [ master ]
    paths:
      - 'functions/**'
      - 'shared/xp-constants.json'
      - 'firebase.json'
      - '.firebaserc'
      - 'monitoring/**'
      - '.github/workflows/functions-ci.yml'
  # Sem `paths` no pull_request: o classificador `changes` (abaixo) decide se o
  # escopo functions foi tocado. Assim um PR que altera shared/xp-constants.json
  # ou scripts/ci (ambos mapeados ao escopo functions) tambem aciona este CI,
  # enquanto um PR web-only nao instala nada de Functions.
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened]
  # Mutation testing roda apenas no schedule noturno (caro demais por PR).
  # O job `mutation` abaixo e gated por `if:` para nao rodar em push/PR.
  schedule:
    - cron: '0 4 * * *' # Todo dia as 04:00 UTC (~01:00 BRT)
  workflow_dispatch:

# Cancela execucoes anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: functions

# Cada job instala do lockfile usando o cache npm local do runner. Isso evita
# depender da cota de Actions artifacts e mantém os jobs reproduzíveis.
jobs:
  changes:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/change-scope.yml

  build:
    name: Build TypeScript
    needs: [ changes ]
    if: github.event_name != 'schedule' && needs.changes.outputs.functions == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  lint:
    name: ESLint Check
    needs: [ build ]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  media-runtime-linux:
    name: FFmpeg 8.1.2 Linux Security Gate
    needs: [ build ]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore verified Linux x64 FFmpeg binary
        uses: actions/cache@v4
        with:
          path: |
            functions/vendor/ffmpeg/ffmpeg
            functions/vendor/ffmpeg/install-manifest.json
          key: ffmpeg-linux-x64-13c2088bdbf4f1baa529d537c37872c810872b8ffab4fa74d39aea4d0332a9b7

      - name: Execute production Linux x64 media security gate
        working-directory: .
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/npm-cache \
            -e npm_config_update_notifier=false \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/functions \
            node:22-bookworm@sha256:5647be709086c696ff32edaaf1c70cd26d1da6ab2b39c32f3c7b4c4a31957e37 \
            bash -lc '
              npm ci --no-audit --no-fund &&
              npm run build &&
              npm run install:ffmpeg &&
              npx jest --no-coverage --runInBand \
                test/group-wall-media-ffmpeg.test.ts \
                test/group-wall-media-contract.test.ts
            '

  test:
    name: Unit Tests
    needs: [ build ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 traz o historico completo. O diff-cover precisa do
      # merge-base com origin/master para isolar as linhas novas/alteradas do PR.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install verified FFmpeg runtime for tests
        run: npm run install:ffmpeg

      # test:coverage = "jest --coverage" → gera coverage/lcov.info (reporter
      # lcov configurado em jest.config.js), consumido pelo gate de diff-coverage.
      - name: Run Tests (com coverage)
        run: npm run test:coverage

      - name: Upload Test Coverage (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage/
          retention-days: 14

      # Gate de DIFF-coverage (Efficiency Hardening F3, spec
      # feat-2026-06-04-efficiency-hardening.md): as linhas NOVAS/ALTERADAS do
      # PR devem ter >= 80% de cobertura. Nao e meta global — so o diff.
      #
      # Garante origin/master no clone antes de o diff-cover comparar (insurance;
      # o fetch-depth: 0 do checkout ja deve ter trazido).
      - name: Garantir base origin/master para o diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin master
        working-directory: .

      # diff-cover e uma ferramenta Python (le lcov + git diff). Instalado em
      # venv isolado em $RUNNER_TEMP — mesmo padrao usado no semgrep.yml (PR
      # #2507), sem poluir o site-packages do sistema.
      - name: Install diff-cover (venv isolado)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m venv "$RUNNER_TEMP/dc-venv"
          "$RUNNER_TEMP/dc-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/dc-venv/bin/pip" install --quiet diff-cover
          "$RUNNER_TEMP/dc-venv/bin/diff-cover" --version

      # GOTCHA verificado (diff-cover 10.0.0): o casamento de caminhos e
      # relativo a RAIZ DO GIT, independente da CWD. O lcov do jest/istanbul
      # emite SF relativo ao rootDir (ex.: `src/xp/processing.ts`), que NAO
      # casa com o path do diff (`functions/src/xp/processing.ts`) → diff-cover
      # imprime "No lines with coverage information" e sai 0 (passa em falso).
      # Normalizamos prefixando `functions/` nos paths relativos sob src/.
      # Paths absolutos (outra forma possivel do istanbul) sao no-op aqui — o
      # diff-cover ja os relativiza sozinho. Redireciona saida para arquivo
      # temporario (compativel Linux/macOS, sem sed -i in-place).
      - name: Normaliza paths do lcov (repo-root-relative)
        if: github.event_name == 'pull_request'
        run: sed -E 's#^SF:(\./)?src/#SF:functions/src/#' coverage/lcov.info > "$RUNNER_TEMP/lcov.norm"

      # --fail-under=80: sai != 0 quando a cobertura do diff < 80% (fica vermelho
      # no PR). Cloud Functions CI nao integra os quatro contextos obrigatorios
      # da protecao de master, entao este gate e educativo/informativo, mas
      # precisa falhar o job para o sinal aparecer.
      - name: Diff-coverage gate (>= 80% nas linhas do PR)
        if: github.event_name == 'pull_request'
        run: |
          "$RUNNER_TEMP/dc-venv/bin/diff-cover" "$RUNNER_TEMP/lcov.norm" \
            --compare-branch=origin/master \
            --diff-range-notation '...' \
            --fail-under=80

  firestore-query-perf:
    name: Firestore Query Performance
    needs: [ build ]
    # Gate pesado isolado do pool self-hosted para evitar OOM/exit 137 (#4074).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Tests perf são experimentais — ESM modules de @google-cloud/firestore
    # quebram com ts-jest default. Marcar non-blocking até ajustar transform.
    continue-on-error: true
    concurrency:
      group: futeba-functions-firebase-emulators
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # firebase-tools >= 13.x requer JDK 21+ pro Firestore emulator.
      # Runner default tem JDK 17 → emulator fail. Setup explícito.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI (se ausente)
        run: |
          if ! command -v firebase &> /dev/null; then
            npm install -g firebase-tools
          fi
          firebase --version

      # "Liberar portas" mantido (aceite #3543): runners reutilizam processos
      # entre runs e emuladores podem deixar portas ocupadas
      # ("Could not start Firestore Emulator, port taken"). lsof -ti retorna
      # PIDs; || true garante que o step nunca falha mesmo se a porta ja
      # estiver livre no runner macOS.
      - name: Liberar portas dos emuladores (cleanup stale processes)
        run: lsof -ti:8085,9099,9199,4000,5001 | xargs kill -9 2>/dev/null || true
        working-directory: .

      - name: Run Firestore Query Performance Tests
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8085"
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-perf-test \
            'cd functions && npm run test:perf'
        working-directory: .

  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    # Caro: roda apenas no schedule noturno ou disparo manual — NUNCA em push/PR.
    # Usa uma instalacao isolada. Fora do caminho
    # critico de PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Mutation Tests
        run: npm run test:mutation

      - name: Upload Mutation Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: functions-mutation-report
          path: functions/reports/mutation/
          retention-days: 14

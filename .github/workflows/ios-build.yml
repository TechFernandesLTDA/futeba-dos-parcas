name: iOS Build & Test

on:
  push:
    branches: [ master, feature/*, release/* ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

# Cancela execucoes anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio: jobs que precisam de mais declaram permissions próprias.
permissions:
  contents: read

jobs:
  ios_app_scope:
    name: Detect iOS app changes
    runs-on: ${{ fromJSON((contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.RUNNER_LABELS_LINUX || '["ubuntu-24.04"]') || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
    steps:
      - name: Checkout code and comparison commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Detect iOS app scope
        id: detect
        run: node scripts/ci/detect-ios-app-changes.js

  kmp-shared-tests:
    name: KMP Shared Unit Tests
    runs-on: ${{ fromJSON((contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.RUNNER_LABELS_HEAVY || '["ubuntu-24.04"]') || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # O default da action instala o pacote legado `tools`, removido do
          # cmdline-tools 16.0 das imagens atuais do runner (sdkmanager sai com 1).
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run shared commonTest (JVM)
        run: ./gradlew --max-workers=3 :shared:testDebugUnitTest --stacktrace

      - name: Run shared iOS Simulator tests
        run: ./gradlew --max-workers=3 :shared:iosSimulatorArm64Test --stacktrace
        continue-on-error: true

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kmp-test-results
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 7

  # O id `build-shared-framework` fica igual porque `build-ios-app` e `notify` dependem dele.
  build-shared-framework:
    name: Build ComposeApp Framework
    # Kotlin/Native para iOS exige macOS: fixo no Mac self-hosted (label `futeba`),
    # nunca em runner hospedado (macOS hospedado consome 10x os minutos gratuitos).
    # Sem runner macOS desde 09/10/2026 (iOS estacionado, #4202): liga com vars.IOS_MAC_RUNNER=true.
    if: vars.IOS_MAC_RUNNER == 'true'
    runs-on: ${{ fromJSON((contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && '["self-hosted","macOS","ARM64","futeba"]' || '"macos-15"') }}
    timeout-minutes: 40
    needs: kmp-shared-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # #4427: o app iOS linka só o ComposeApp.framework, que já embute o :shared
      # (iosApp/project.yml). Linkar também o shared.framework era trabalho morto e,
      # no Xcode, duplicava o runtime do Kotlin/Native. O código do :shared continua
      # compilado aqui (dependência do ComposeApp) e testado no job kmp-shared-tests.
      - name: Build ComposeApp framework for iOS Simulator
        run: ./gradlew --max-workers=3 :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Build ComposeApp framework for iOS Device
        run: ./gradlew --max-workers=3 :composeApp:linkDebugFrameworkIosArm64

  build-ios-app:
    name: Build iOS App
    # Xcode so existe no Mac self-hosted (label `futeba`); sem minutos hospedados.
    runs-on: ${{ fromJSON((contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && '["self-hosted","macOS","ARM64","futeba"]' || '"macos-15"') }}
    timeout-minutes: 60
    needs: [build-shared-framework, ios_app_scope]
    if: vars.IOS_MAC_RUNNER == 'true' && needs.ios_app_scope.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4  # v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Cada job pode cair em um runner diferente. Recompilar os frameworks
      # necessários aqui mantém o gate determinístico e independente da cota
      # de armazenamento de artifacts do GitHub Actions.
      - name: Build simulator framework for app job
        run: ./gradlew --max-workers=3 :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Generate Xcode project and install CocoaPods
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd iosApp
          xcodegen generate
          pod install

      - name: Build iOS App (Simulator)
        run: |
          xcodebuild -jobs 3 -workspace iosApp/iosApp.xcworkspace \
                     -scheme iosApp \
                     -destination 'generic/platform=iOS Simulator' \
                     -configuration Debug \
                     clean build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     ARCHS=arm64 \
                     ONLY_ACTIVE_ARCH=YES \
                     SKIP_KMP_BUILD=YES

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/DiagnosticReports/
            DerivedData/Logs/
          retention-days: 3

  notify:
    name: Notify Build Status
    runs-on: ${{ fromJSON((contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.RUNNER_LABELS_LINUX || '["ubuntu-24.04"]') || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    needs: [kmp-shared-tests, build-shared-framework, build-ios-app, ios_app_scope]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "KMP Tests: ${{ needs.kmp-shared-tests.result }}"
          echo "ComposeApp Framework Build: ${{ needs.build-shared-framework.result }}"
          echo "iOS App Build: ${{ needs.build-ios-app.result }}"

          if [ "${{ vars.IOS_MAC_RUNNER }}" != "true" ]; then
            if [ "${{ needs.kmp-shared-tests.result }}" != "success" ]; then
              echo "KMP shared tests failed"; exit 1
            fi
            echo "Sem runner macOS (iOS estacionado, #4202): só os testes KMP compartilhados rodaram."
            exit 0
          fi

          if [ "${{ needs.kmp-shared-tests.result }}" != "success" ] || \
             [ "${{ needs.build-shared-framework.result }}" != "success" ]; then
            echo "iOS pipeline had failures"
            exit 1
          fi

          if [ "${{ needs.build-ios-app.result }}" == "success" ]; then
            echo "iOS pipeline succeeded!"
          elif [ "${{ needs.build-ios-app.result }}" == "skipped" ] && \
               [ "${{ needs.ios_app_scope.outputs.should_run }}" != "true" ]; then
            echo "iOS app build skipped: no iOS app files changed"
          else
            echo "iOS pipeline had failures"
            exit 1
          fi

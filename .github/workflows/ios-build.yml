name: iOS Build & Test

on:
  push:
    branches: [ master, feature/*, release/* ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradle.properties'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

# Cancela execucoes anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kmp-shared-tests:
    name: KMP Shared Unit Tests
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run shared commonTest (JVM)
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: Run shared iOS Simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
        continue-on-error: true

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kmp-test-results
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 7

  build-shared-framework:
    name: Build Shared KMP Framework
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 40
    needs: kmp-shared-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shared framework for iOS Simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build shared framework for iOS Device
        run: ./gradlew :shared:linkDebugFrameworkIosArm64

      - name: Build ComposeApp framework for iOS Simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

  build-ios-app:
    name: Build iOS App
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 60
    needs: build-shared-framework
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4  # v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Cada job pode cair em um runner diferente. Recompilar os frameworks
      # necessários aqui mantém o gate determinístico e independente da cota
      # de armazenamento de artifacts do GitHub Actions.
      - name: Build simulator frameworks for app job
        run: |
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Generate Xcode project and install CocoaPods
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd iosApp
          xcodegen generate
          pod install

      - name: Build iOS App (Simulator)
        run: |
          xcodebuild -workspace iosApp/iosApp.xcworkspace \
                     -scheme iosApp \
                     -destination 'generic/platform=iOS Simulator' \
                     -configuration Debug \
                     clean build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     ARCHS=arm64 \
                     ONLY_ACTIVE_ARCH=YES \
                     SKIP_KMP_BUILD=YES

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/DiagnosticReports/
            DerivedData/Logs/
          retention-days: 3

  notify:
    name: Notify Build Status
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 5
    needs: [kmp-shared-tests, build-shared-framework, build-ios-app]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "KMP Tests: ${{ needs.kmp-shared-tests.result }}"
          echo "Framework Build: ${{ needs.build-shared-framework.result }}"
          echo "iOS App Build: ${{ needs.build-ios-app.result }}"

          if [ "${{ needs.kmp-shared-tests.result }}" == "success" ] && \
             [ "${{ needs.build-shared-framework.result }}" == "success" ] && \
             [ "${{ needs.build-ios-app.result }}" == "success" ]; then
            echo "iOS pipeline succeeded!"
          else
            echo "iOS pipeline had failures"
            exit 1
          fi

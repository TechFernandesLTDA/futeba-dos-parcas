name: Sync Labels

on:
  push:
    branches:
      - master
    paths:
      - .github/labels.yml

# Cancela sync anterior se novo push chegar
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: read
      issues: write
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || '["self-hosted","Linux","X64","futeba-general"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c  # v1
        with:
          manifest: .github/labels.yml
          # Nunca apagar labels fora do manifesto (histórico de milhares de issues).
          prune: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

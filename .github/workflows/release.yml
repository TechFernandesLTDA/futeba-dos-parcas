name: Release

on:
  push:
    tags:
      - 'android-v*.*.*'  # releases Android (esquema escopado por plataforma)
      - 'v*.*.*'          # legado (transicao) — releases antigas repo-wide
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Android existente para recuperar GitHub Release/notas'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

# Nunca cancela uma release em andamento (evita upload parcial de assets);
# execucoes da mesma tag ficam em fila.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

# Menor privilégio: jobs que precisam de mais declaram permissions próprias.
permissions:
  contents: read

jobs:
  build-release:
    name: Build and Create GitHub Release
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag and checkout
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(android-v|v)[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag de release invalida: $RELEASE_TAG"
            exit 1
          fi
          if ! TAG_SHA=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}"); then
            echo "::error::Tag nao encontrada: $RELEASE_TAG"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Checkout $HEAD_SHA nao corresponde a $RELEASE_TAG ($TAG_SHA)"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Create local.properties with signing config
        env:
          # FIX 2026-05-11: secret names alinhados com deploy-production.yml
          # (eram KEYSTORE_PASSWORD_BASE64 que não existem — secrets reais
          # são KEYSTORE_PASSWORD_B64). Keys do local.properties também
          # alinhados com app/build.gradle.kts que lê STORE_FILE, STORE_PASSWORD,
          # KEY_ALIAS, KEY_PASSWORD (não RELEASE_*).
          KEYSTORE_PASSWORD_B64: ${{ secrets.KEYSTORE_PASSWORD_B64 }}
          KEY_PASSWORD_B64: ${{ secrets.KEY_PASSWORD_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          STORE_PW=$(printf '%s' "$KEYSTORE_PASSWORD_B64" | base64 --decode)
          KEY_PW=$(printf '%s' "$KEY_PASSWORD_B64" | base64 --decode)
          {
            printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            printf 'STORE_FILE=%s/release.jks\n' "$RUNNER_TEMP"
            printf 'STORE_PASSWORD=%s\n' "$STORE_PW"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PW"
          } > local.properties
          # Mascara senhas no log
          sed 's/=.*$/=***MASKED***/' local.properties

      - name: Decode and save keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "✗ empty keystore"
            exit 1
          fi
          echo "✓ keystore written ($(wc -c < "$RUNNER_TEMP/release.jks") bytes)"

      - name: Create google-services.json placeholder
        run: |
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "placeholder" }]
            }]
          }
          GSEOF

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${RELEASE_TAG#android-v}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        id: changelog
        run: |
          # Pegar commits desde a ultima tag de release Android (escopada ou legada)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'android-v*' --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges "${PREVIOUS_TAG}..HEAD")
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Android ${{ steps.ver.outputs.version }}
          body: |
            ## Release ${{ env.RELEASE_TAG }}

            ### Changelog
            ${{ steps.changelog.outputs.changelog }}

            ### Arquivos
            - **app-release.aab** - Para upload na Play Store
            - **app-release.apk** - Para instalacao direta

            ### Download
            [Google Play Store](https://play.google.com/store/apps/details?id=com.futebadosparcas)

            A publicacao no Play e validada separadamente pelo workflow
            `Deploy to Google Play Store`.
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release-notes:
    name: Publish Release Notes
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    needs: build-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version from tag
        id: ver
        # release.yml dispara em android-v*.*.* (escopado) ou v*.*.* (legado).
        # Remove o prefixo "android-v" e depois "v" para obter a versao limpa.
        run: |
          VERSION="${RELEASE_TAG#android-v}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release notes source file
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          FILE="release-notes/android/${VERSION}.md"
          if [ -f "$FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "OK: $FILE encontrado"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$FILE nao existe — pulando publish da nota no Firestore."
          fi

      - name: Install dependencies (firebase-admin)
        if: steps.notes.outputs.exists == 'true'
        env:
          HUSKY: '0'
        run: npm ci

      - name: Write service account credentials
        if: steps.notes.outputs.exists == 'true'
        env:
          # SA Firebase reaproveitada (mesmo secret do deploy Play Store).
          # Requer roles/datastore.user para escrever em release_notes.
          SA_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Validate and publish release notes
        if: steps.notes.outputs.exists == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node scripts/release-notes.js validate
          node scripts/release-notes.js publish --platform android --version "$VERSION"

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancela execucoes anteriores do mesmo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml

  android:
    name: Android Gradle Validation
    needs: changes
    if: needs.changes.outputs.android == 'true'
    # Android's hosted Linux image provides the supported SDK/Gradle toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5
        with:
          cache-read-only: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and validate Android SDK 36
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-36"
          test -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-36/android.jar"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties

      - name: Create google-services.json placeholder
        run: |
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{ "current_key": "AIzaSyA00000000000000000000000000000000" }]
            }]
          }
          GSEOF

      - name: Check for spec file
        run: |
          # Verifica se o PR tem uma spec linkada (opcional - apenas warning)
          echo "Reminder: PRs should reference a spec file in /specs/"

      - name: Design tokens parity (web/Android/composeApp vs shared/design-tokens.json)
        run: |
          node --test scripts/check-design-tokens-motion.test.js
          node scripts/check-design-tokens-parity.js

      - name: Build Check
        run: ./gradlew --max-workers=6 --no-daemon compileDebugKotlin

      - name: Detekt (analise estatica com baseline)
        run: ./gradlew --max-workers=6 --no-daemon detekt

      - name: Unit Tests
        run: ./gradlew --max-workers=6 --no-daemon :app:testDebugUnitTest

      - name: Check for hardcoded strings
        run: |
          # Verifica se ha strings hardcoded em arquivos modificados
          HARDCODED=$(git diff origin/master --name-only -- '*.kt' | xargs grep -l 'text = "' 2>/dev/null | grep -v "Test" || true)
          if [ -n "$HARDCODED" ]; then
            echo "::warning::Possible hardcoded strings found in: $HARDCODED"
          fi

      - name: Check for hardcoded colors
        run: |
          HARDCODED_COLORS=$(git diff origin/master --name-only -- '*.kt' | xargs grep -l 'Color\.\(Black\|White\|Gray\)' 2>/dev/null | grep -v "Test\|theme\|Theme\|Gamification" || true)
          if [ -n "$HARDCODED_COLORS" ]; then
            echo "::warning::Possible hardcoded colors found in: $HARDCODED_COLORS"
          fi

  validate:
    name: Validate PR
    if: always()
    needs: [ changes, android ]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 5
    steps:
      - name: Verify scoped PR checks
        env:
          ANDROID_CHANGED: ${{ needs.changes.outputs.android }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change classification failed."
            exit 1
          fi

          if [ "$ANDROID_CHANGED" = "true" ] && [ "$ANDROID_RESULT" != "success" ]; then
            echo "Android Gradle validation did not complete successfully."
            exit 1
          fi

          echo "PR scope validation completed successfully."

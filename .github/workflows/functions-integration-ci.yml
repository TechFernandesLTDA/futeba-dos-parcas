name: Functions Integration CI (#2533)

# Roda os testes de INTEGRAÇÃO das Cloud Functions contra o Firebase Emulator
# Suite (firestore + functions) — sem mocks, disparando triggers reais.
#
# Guarda de regressão para o domínio Grupos (#2530):
#   - onInviteRedeemed + member-counter e2e (#2531) — fecha o gap das
#     0 invocações em prod do invite-join (#2518).
#
# O E2E web (discover/preview público, #2532) é wired em workflow próprio
# quando aquela suite estiver validada — ver #2533/#2530.
#
# Issue #3543: roda em ubuntu-latest e REUSA o artifact lib/ + node_modules/
# produzido pelo job `build` do functions-ci.yml (cross-workflow), evitando uma
# segunda instalacao + `npm run build`. Se o artifact nao estiver disponivel a
# tempo (ex.: PR rules-only onde functions-ci nao rodou), faz fallback para
# instalacao + `npm run build` locais — a suite de integracao sempre executa.

on:
  push:
    branches: [master]
    paths:
      - "functions/**"
      - "shared/xp-constants.json"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - ".github/workflows/functions-integration-ci.yml"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancela execuções anteriores do mesmo branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read  # necessario p/ baixar artifact cross-workflow via `gh`

jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml

  functions-integration:
    name: Functions Integration — Emulador (firestore+functions)
    needs: [ changes ]
    # Roda quando functions OU rules mudam: rules (firestore.rules) afetam os
    # triggers/disparos testados aqui. Um PR web-only nao aciona este workflow.
    if: needs.changes.outputs.functions == 'true' || needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java 21 (requerido pelo emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # Reuso cross-workflow do artifact do functions-ci build (issue #3543).
      # functions-ci dispara em paralelo; o artifact so fica disponivel depois
      # que o job `build` termina. Polling de ate ~6min (24 x 15s). Se encontrar,
      # baixa lib/ + node_modules/ e pula a instalacao + `npm run build`. Se nao
      # (ex.: functions-ci nao rodou num PR rules-only, ou build falhou/ainda
      # rodando), cai no fallback abaixo — a suite sempre executa.
      - name: Reusar build artifact do functions-ci (lib + node_modules)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ARTIFACT="functions-build-linux-node22-${{ hashFiles('functions/package-lock.json') }}"
          for i in $(seq 1 24); do
            RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/functions-ci.yml/runs?head_sha=${HEAD_SHA}&per_page=20" \
              --jq '[.workflow_runs[]] | .[0].id // ""' 2>/dev/null || true)
            if [ -n "${RUN_ID}" ] && gh run download "${RUN_ID}" -n "${ARTIFACT}" -D functions; then
              echo "Artifact '${ARTIFACT}' reutilizado do functions-ci run ${RUN_ID}."
              echo "REUSED_ARTIFACT=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Tentativa $i/24: artifact ainda nao disponivel. Nova tentativa em 15s."
            sleep 15
          done
          echo "::warning::Artifact do functions-ci indisponivel apos ~6min. Usando fallback (install + build)."
          echo "REUSED_ARTIFACT=false" >> "$GITHUB_ENV"

      - name: Instalar dependências (fallback — artifact indisponível)
        if: env.REUSED_ARTIFACT != 'true'
        working-directory: functions
        run: npm ci

      - name: Compilar functions (fallback — artifact indisponível)
        if: env.REUSED_ARTIFACT != 'true'
        working-directory: functions
        run: npm run build

      - name: Liberar portas dos emuladores
        run: lsof -ti:8085,9099,9199,4000,5001,4400,4500 | xargs kill -9 2>/dev/null || true

      - name: Executar testes de integração no emulador
        # emulators:exec sobe firestore+functions, exporta FIRESTORE_EMULATOR_HOST,
        # roda o jest e derruba o emulador ao final. Os triggers v2 são carregados
        # do build em lib/ pelo emulador de functions.
        working-directory: functions
        run: |
          npx firebase-tools emulators:exec \
            --only firestore,functions \
            --project futebadosparcas \
            'npx jest -c jest.integration.config.js test/integration --no-coverage --ci --runInBand'
        env:
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"

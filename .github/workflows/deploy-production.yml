name: Deploy to Google Play Store

# #065 - Production Deployment
# Deploys somente no Play Store quando uma tag Android e criada.
# GitHub Release e assets sao responsabilidade exclusiva de release.yml,
# permitindo recuperar metadados sem republicar o mesmo versionCode no Play.

on:
  push:
    tags:
      # Apenas tags semver estritas disparam deploy de producao.
      # Padrao 'v*' era perigoso: tags como 'vdebug-test' disparariam deploy
      # acidental pro Play Store. Alinhado com release.yml (#2200).
      # Fase 1 (#2509): tag escopada por plataforma 'android-v*.*.*' (que o
      # version-bump passa a gerar) DEVE disparar o deploy do Play Store.
      # Sem isto, o bump produziria android-v* e o deploy nunca rodaria
      # (release.yml criaria a release, mas o Play Store ficaria pra tras).
      # 'v*.*.*' mantido como legado de transicao.
      - 'android-v*.*.*'
      - 'v*.*.*'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      dry_run:
        description: 'Só compila e assina o AAB (sem enviar à Play). Valida o runner/assinatura.'
        type: boolean
        default: false

permissions:
  contents: read

# Deploys nunca são cancelados no meio; execuções do mesmo ref entram em fila.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Build & Deploy to Play Store
    runs-on: ${{ fromJSON((contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.RUNNER_LABELS_HEAVY || '["ubuntu-24.04"]') || '"ubuntu-24.04"') }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Setup Node (guarda de 16 KB)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          test -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-37.0/android.jar"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties with signing config
        env:
          # Senhas em base64 pra evitar shell expansion de $ chars.
          # gh secret set com --body inline expandia $1, $10 etc nas senhas
          # tipo "VAN$14nusa/10" → resultava em apenas 1 char salvo.
          KEYSTORE_PASSWORD_B64: ${{ secrets.KEYSTORE_PASSWORD_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_B64: ${{ secrets.KEY_PASSWORD_B64 }}
        run: |
          STORE_PW=$(printf '%s' "$KEYSTORE_PASSWORD_B64" | base64 --decode)
          KEY_PW=$(printf '%s' "$KEY_PASSWORD_B64" | base64 --decode)
          {
            printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            printf 'STORE_FILE=%s/release.jks\n' "$RUNNER_TEMP"
            printf 'STORE_PASSWORD=%s\n' "$STORE_PW"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PW"
          } > local.properties
          # Verificar conteudo final do local.properties (mascara senhas)
          sed 's/=.*$/=***MASKED***/' local.properties

      - name: Decode and save keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_B64: ${{ secrets.KEYSTORE_PASSWORD_B64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "✗ empty keystore"
            exit 1
          fi
          echo "✓ keystore written ($(wc -c < "$RUNNER_TEMP/release.jks") bytes)"
          # Debug: SHA do keystore + tentar abrir com keytool
          KS_SHA=$(shasum -a 256 "$RUNNER_TEMP/release.jks" | awk '{print $1}' | head -c 16)
          echo "::notice::keystore sha8=$KS_SHA"
          STORE_PW=$(printf '%s' "$KEYSTORE_PASSWORD_B64" | base64 --decode)
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PW" >/tmp/kt.log 2>&1; then
            echo "✓ keytool list OK (pwd from b64 secret)"
          else
            echo "✗ keytool failed (pwd from b64 secret):"
            cat /tmp/kt.log
            exit 1
          fi
          # Verificar que local.properties foi gravado corretamente
          PW_FROM_FILE=$(grep '^STORE_PASSWORD=' local.properties | sed 's/^STORE_PASSWORD=//')
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW_FROM_FILE" >/tmp/kt2.log 2>&1; then
            echo "✓ keytool list OK (pwd from local.properties grep)"
          else
            echo "✗ keytool failed (pwd from local.properties grep):"
            cat /tmp/kt2.log
            exit 1
          fi

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          # printf '%s' preserva multi-line JSON com chars especiais.
          # Antes: echo '${{ secrets.X }}' interpolava raw e quebrava em quotes/parens dentro do JSON.
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Release AAB
        # --no-configuration-cache + --rerun-tasks forca leitura fresca do
        # local.properties (config cache podia estar usando senha velha de
        # tentativas anteriores que tinham bytes corrompidos).
        run: ./gradlew bundleRelease --no-configuration-cache --rerun-tasks

      - name: Guarda Play - contrato de targetSdk e 16 KB (testes)
        run: node --test scripts/ci/play-requirements-contract.test.js scripts/ci/check-16kb-alignment.test.js

      # Falha o job (inclusive em dry_run, antes de qualquer upload) se alguma .so
      # arm64-v8a/x86_64 do AAB nao estiver alinhada em 16 KB. Ver docs/RELEASE_PROCESS.md
      # (secao "Requisitos do Google Play").
      - name: Guarda Play - alinhamento de 16 KB das bibliotecas nativas (AAB)
        run: node scripts/ci/check-16kb-alignment.js app/build/outputs/bundle/release/app-release.aab

      - name: Verificar assinatura do AAB (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1
          echo "Dry run: AAB assinado; upload para a Play pulado."

      - name: Upload AAB to Play Store (Internal Testing)
        if: ${{ !inputs.dry_run }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.futebadosparcas
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2
          # NAO usar changesNotSentForReview: com a publicacao gerenciada desligada a Play
          # envia as mudancas para revisao automaticamente e o commit do edit falha com
          # "Changes are sent for review automatically. The query parameter
          # changesNotSentForReview must not be set." (run 38276700533, android-v1.41.0).
          # O upload para a trilha internal nao depende de revisao.

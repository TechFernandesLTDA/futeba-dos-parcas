name: Deploy to Google Play Store

# #065 - Production Deployment
# Deploys to Play Store when a release tag is created

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.5.0)
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-production:
    name: Build & Deploy to Play Store
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties with signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # KEYSTORE_PATH hardcoded (nao precisa ser secret — path nao eh sensivel).
          # Quando era secret, GH mascarava o valor inteiro e o Gradle via path
          # vazio (caia em app/<empty>).
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - name: Decode and save keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Verificar se foi escrito (sem revelar conteudo)
          test -s "$RUNNER_TEMP/release.jks" && echo "✓ keystore written ($(wc -c < "$RUNNER_TEMP/release.jks") bytes)" || (echo "✗ empty keystore"; exit 1)

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          # printf '%s' preserva multi-line JSON com chars especiais.
          # Antes: echo '${{ secrets.X }}' interpolava raw e quebrava em quotes/parens dentro do JSON.
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Upload AAB to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.futebadosparcas
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Production Release

            This release has been deployed to Google Play Store (Internal Testing).

            **What's Changed:**
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

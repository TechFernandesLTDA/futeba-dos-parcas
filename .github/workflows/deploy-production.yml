name: Deploy to Google Play Store

# #065 - Production Deployment
# Deploys to Play Store when a release tag is created

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.5.0)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write   # Para criar GitHub Release
  id-token: write   # Para OIDC token (se necessário no futuro)

jobs:
  deploy-production:
    name: Build & Deploy to Play Store
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties with signing config
        env:
          # Senhas em base64 pra evitar shell expansion de $ chars.
          # gh secret set com --body inline expandia $1, $10 etc nas senhas
          # tipo "VAN$14nusa/10" → resultava em apenas 1 char salvo.
          KEYSTORE_PASSWORD_B64: ${{ secrets.KEYSTORE_PASSWORD_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_B64: ${{ secrets.KEY_PASSWORD_B64 }}
        run: |
          STORE_PW=$(printf '%s' "$KEYSTORE_PASSWORD_B64" | base64 --decode)
          KEY_PW=$(printf '%s' "$KEY_PASSWORD_B64" | base64 --decode)
          # Debug: SHA8 e len pra confirmar decode
          STORE_SHA=$(printf '%s' "$STORE_PW" | shasum -a 256 | head -c 16)
          STORE_LEN=${#STORE_PW}
          B64_LEN=${#KEYSTORE_PASSWORD_B64}
          echo "::notice::DEBUG b64_len=$B64_LEN store_pw_len=$STORE_LEN sha8=$STORE_SHA"
          {
            printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            printf 'STORE_FILE=%s/release.jks\n' "$RUNNER_TEMP"
            printf 'STORE_PASSWORD=%s\n' "$STORE_PW"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PW"
          } > local.properties
          # Verificar conteudo final do local.properties (mascara senhas)
          sed 's/=.*$/=***MASKED***/' local.properties

      - name: Decode and save keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_B64: ${{ secrets.KEYSTORE_PASSWORD_B64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" && echo "✓ keystore written ($(wc -c < "$RUNNER_TEMP/release.jks") bytes)" || (echo "✗ empty keystore"; exit 1)
          # Debug: SHA do keystore + tentar abrir com keytool
          KS_SHA=$(shasum -a 256 "$RUNNER_TEMP/release.jks" | awk '{print $1}' | head -c 16)
          echo "::notice::keystore sha8=$KS_SHA"
          STORE_PW=$(printf '%s' "$KEYSTORE_PASSWORD_B64" | base64 --decode)
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PW" >/tmp/kt.log 2>&1; then
            echo "✓ keytool list OK (pwd from b64 secret)"
          else
            echo "✗ keytool failed (pwd from b64 secret):"
            cat /tmp/kt.log
            exit 1
          fi
          # Tambem testar com pwd lido de local.properties (igual Gradle faz)
          PW_FROM_FILE=$(grep '^STORE_PASSWORD=' local.properties | sed 's/^STORE_PASSWORD=//')
          PW_FROM_FILE_LEN=${#PW_FROM_FILE}
          PW_FROM_FILE_SHA=$(printf '%s' "$PW_FROM_FILE" | shasum -a 256 | head -c 16)
          echo "::notice::pwd from local.properties: len=$PW_FROM_FILE_LEN sha8=$PW_FROM_FILE_SHA"
          if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW_FROM_FILE" >/tmp/kt2.log 2>&1; then
            echo "✓ keytool list OK (pwd from local.properties grep)"
          else
            echo "✗ keytool failed (pwd from local.properties grep):"
            cat /tmp/kt2.log
          fi

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          # printf '%s' preserva multi-line JSON com chars especiais.
          # Antes: echo '${{ secrets.X }}' interpolava raw e quebrava em quotes/parens dentro do JSON.
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Release AAB
        # --no-configuration-cache + --rerun-tasks forca leitura fresca do
        # local.properties (config cache podia estar usando senha velha de
        # tentativas anteriores que tinham bytes corrompidos).
        run: ./gradlew bundleRelease --no-configuration-cache --rerun-tasks

      - name: Upload AAB to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.futebadosparcas
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2
          changesNotSentForReview: true

      # AAB ja foi enviado ao Play Store no passo anterior; este upload e so backup.
      # continue-on-error evita que falha de quota de artifact marque o deploy como vermelho
      # depois que o Play Store ja recebeu o release com sucesso.
      - name: Upload AAB artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Production Release

            This release has been deployed to Google Play Store (Internal Testing).

            **What's Changed:**
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

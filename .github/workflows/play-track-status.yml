name: Play Track Status

# Consulta SOMENTE LEITURA das trilhas do Google Play com a service account de
# publicacao (PLAY_STORE_SERVICE_ACCOUNT_JSON). Usado para provar que um build
# (versionCode) esta na trilha apos o workflow `Deploy to Google Play Store`.
#
# Vigia diario (#4417): no schedule, roda com --audit. Se ha release de
# producao gravada e a pagina publica da loja responde 404 (em analise,
# recusada ou aprovada esperando "Publicar"), abre UMA issue e lembra a cada
# 7 dias; fecha sozinha quando a loja responder 200. A Play Developer API nao
# expoe o status da revisao nem o Status da politica: ver o cabecalho de
# scripts/ci/play-track-status.js.

on:
  schedule:
    - cron: '17 12 * * *' # todo dia 12:17 UTC (~09:17 BRT)
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode esperado (ex.: 81). Vazio = so listar'
        required: false
        type: string
      track:
        description: 'Trilha onde o versionCode deve estar (ex.: internal). Vazio = qualquer'
        required: false
        default: internal
        type: string
      audit:
        description: 'Rodar o vigia (abre/atualiza/fecha a issue da loja)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  status:
    name: Play track status
    runs-on: ${{ fromJSON((contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.RUNNER_LABELS_HEAVY || '["ubuntu-24.04"]') || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/play-sa.json"
          test -s "$RUNNER_TEMP/play-sa.json"
          node scripts/ci/describe-service-account.js "$RUNNER_TEMP/play-sa.json"

      - name: Query tracks
        if: github.event_name != 'schedule' && !inputs.audit
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/play-sa.json
          VERSION_CODE: ${{ inputs.version_code }}
          TRACK: ${{ inputs.track }}
        run: |
          ARGS=(--package com.futebadosparcas)
          if [ -n "$VERSION_CODE" ]; then ARGS+=(--version-code "$VERSION_CODE"); fi
          if [ -n "$TRACK" ]; then ARGS+=(--track "$TRACK"); fi
          node scripts/ci/play-track-status.js "${ARGS[@]}"

      - name: Play watchdog (loja x producao)
        if: github.event_name == 'schedule' || inputs.audit
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/play-sa.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/ci/play-track-status.js --package com.futebadosparcas --audit --github-repo "$REPO"

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/play-sa.json"

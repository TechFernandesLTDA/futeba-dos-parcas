name: "Semgrep Security Scan"

# Scan estatico de seguranca (SAST) focado nas superficies TypeScript:
# functions/src e web/src. Guardrail barato contra os pontos-cegos
# sistematicos de codigo gerado por IA: deserializacao insegura, XSS,
# secrets hardcoded e validacao de input ausente.
on:
  pull_request:
    branches: [master, develop]
    paths:
      - 'functions/**'
      - 'web/**'
      # Self-validacao: mudancas no proprio workflow disparam o scan
      - '.github/workflows/semgrep.yml'
  schedule:
    # Semanal — segunda-feira 03:30 UTC.
    # Horario deslocado do CodeQL (01:30) para nao competir pelo runner.
    - cron: '30 3 * * 1'
  workflow_dispatch:

# Cancela scan anterior do mesmo branch/PR (mesmo padrao do codeql.yml/web-ci.yml)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (TypeScript)
    # O venv mantém o Semgrep isolado no runner macOS persistente.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 25
    permissions:
      # Necessario para o upload-sarif publicar na aba Security.
      security-events: write
      contents: read
      # Repo privado: upload-sarif exige actions:read (igual ao codeql.yml).
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Instalamos o Semgrep num venv isolado em
      # $RUNNER_TEMP: sem poluir o site-packages do sistema e sem
      # --break-system-packages. (A action Docker returntocorp/semgrep e estavel
      # em Linux, mas o venv mantem o controle de versao explicito.)
      - name: Install Semgrep CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version

      # Rulesets: TypeScript, React, OWASP Top Ten, Secrets e JavaScript.
      # SOFT GATE (report-only): findings (exit 1) NAO quebram o build nesta fase
      # — aparecem na aba Security via SARIF. Mas uma falha de infra (semgrep nao
      # gerou SARIF) quebra o job de proposito, em vez de ser mascarada por
      # `|| true` (evita scan silenciosamente vazio passando como verde).
      # Podemos endurecer depois (falhar em findings) quando o ruido baixar.
      - name: Run Semgrep scan
        run: |
          set +e
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/javascript \
            functions/src web/src \
            --sarif --output semgrep.sarif \
            --metrics off
          SCAN_EXIT=$?
          set -e
          if [ ! -f semgrep.sarif ]; then
            echo "::error::Semgrep nao gerou SARIF (exit=$SCAN_EXIT) — scan falhou (infra)."
            exit 1
          fi
          echo "Semgrep concluido (exit=$SCAN_EXIT). Findings publicados via SARIF (soft gate)."

      # `if: always() && hashFiles(...)`: faz upload mesmo com findings (semgrep
      # sai != 0), mas so se o SARIF existir — evita o erro "Path does not exist"
      # quando o scan falhou antes de gerar o arquivo.
      - name: Upload SARIF to Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57  # v3
        with:
          sarif_file: semgrep.sarif
          # Categoria propria — nao colide com o upload do CodeQL.
          category: semgrep

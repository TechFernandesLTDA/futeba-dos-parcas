# Workflow de Android Macrobenchmark — Futeba dos Parças
#
# Executa benchmarks de startup e scroll em emulador API 34 após merges no master.
# NÃO executa em PRs (benchmarks são lentos e necessitam de dispositivo/emulador).
#
# Para executar manualmente: Actions → Android Macrobenchmark → Run workflow
#
# Resultados: disponíveis como artifact "macrobenchmark-results" por 30 dias.
# Interpretar com Android Studio Benchmark plugin ou abrir o JSON diretamente.

name: Android Macrobenchmark

on:
  # Só manual: sem o Mac, o emulador roda no pool Linux compartilhado (tf-wsl, KVM).
  workflow_dispatch:

# Cancela execução anterior do mesmo branch para poupar runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'jetbrains'
  EMULATOR_API: 34

# Menor privilégio: jobs que precisam de mais declaram permissions próprias.
permissions:
  contents: read

jobs:
  macrobenchmark:
    name: Macrobenchmark (API 34)
    runs-on: ${{ fromJSON((contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.RUNNER_LABELS_HEAVY || '["ubuntu-24.04"]') || '"ubuntu-24.04"') }}
    timeout-minutes: 60

    env:
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 21 (JetBrains, daemon toolchain)
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          test -f "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/platforms/android-37.0/android.jar"

      - name: Configurar ambiente Android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          mkdir -p app
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.futebadosparcas" }
              },
              "api_key": [{
                "current_key": "AIzaSyA00000000000000000000000000000000"
              }]
            }]
          }
          GSEOF

      - name: Build APK de benchmark do :app
        run: ./gradlew --max-workers=3 --no-daemon :app:assembleBenchmark

      - name: Executar Macrobenchmarks no emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --max-workers=3 --no-daemon :macrobenchmark:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.profiling.mode=None -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE

      - name: Upload resultados dos benchmarks
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark-results-${{ env.COMMIT_SHA }}
          path: |
            macrobenchmark/build/outputs/connected_android_test_additional_output/
            macrobenchmark/build/outputs/androidTest-results/
          retention-days: 7

      - name: Resumo no GitHub Step Summary
        if: always()
        run: |
          {
            echo "## Macrobenchmark Results"
            echo "**Commit:** $COMMIT_SHA"
            echo "**Emulator API:** $EMULATOR_API"
            echo "Os resultados completos estão disponíveis no artifact macrobenchmark-results."
            echo "Para interpretar: abra os arquivos JSON no Android Studio via Run > Open Profiler Results."
          } >> "$GITHUB_STEP_SUMMARY"

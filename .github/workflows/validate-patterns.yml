name: Validate Patterns

on:
  pull_request:
    branches: [master]
    paths:
      - 'web/**'
      - 'functions/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/validate-patterns.yml'
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'functions/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/validate-patterns.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    uses: ./.github/workflows/change-scope.yml

  # Os 4 checks curtos (audit / secrets / rules catch-all / headers) são todos
  # bash/grep/ripgrep que levam segundos. Rodam sempre (safety-net repo-wide) e
  # em paralelo com o classificador para reduzir fan-out e tempo de fila.
  validate-conventions:
    name: Conventions (audit, secrets, rules, headers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          if ! command -v rg &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Run audit patterns
        run: bash scripts/audit-patterns.sh

      - name: Check secrets
        run: bash scripts/check-secrets.sh

      - name: Verify firestore.rules has catch-all deny
        run: |
          if tail -10 firestore.rules | grep -q 'allow read, write: if false'; then
            echo "✅ firestore.rules: catch-all deny presente"
          else
            echo "❌ firestore.rules: catch-all deny NÃO encontrado no final do arquivo!"
            exit 1
          fi

      - name: Verify storage.rules has catch-all deny
        run: |
          if tail -10 storage.rules | grep -q 'allow read, write: if false'; then
            echo "✅ storage.rules: catch-all deny presente"
          else
            echo "❌ storage.rules: catch-all deny NÃO encontrado no final do arquivo!"
            exit 1
          fi

      - name: Check X-Content-Type-Options header
        run: |
          if grep -q 'X-Content-Type-Options' firebase.json; then
            echo "✅ X-Content-Type-Options presente"
          else
            echo "❌ X-Content-Type-Options ausente em firebase.json"
            exit 1
          fi

      - name: Check X-Frame-Options header
        run: |
          if grep -q 'X-Frame-Options' firebase.json; then
            echo "✅ X-Frame-Options presente"
          else
            echo "❌ X-Frame-Options ausente em firebase.json"
            exit 1
          fi

      - name: Check X-XSS-Protection header
        run: |
          if grep -q 'X-XSS-Protection' firebase.json; then
            echo "✅ X-XSS-Protection presente"
          else
            echo "❌ X-XSS-Protection ausente em firebase.json"
            exit 1
          fi

      - name: Upload audit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: audit-patterns-report
          path: audit-report.txt
          retention-days: 7

  validate-pre-push:
    name: Pre-Push Validation
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        if: needs.changes.outputs.web == 'true'
        run: cd web && npm ci

      - name: Install functions dependencies
        if: needs.changes.outputs.functions == 'true'
        run: cd functions && npm ci

      - name: Web ESLint
        if: needs.changes.outputs.web == 'true'
        run: cd web && npm run lint

      - name: Functions build
        if: needs.changes.outputs.functions == 'true'
        run: cd functions && npm run build

      - name: Functions lint
        if: needs.changes.outputs.functions == 'true'
        run: cd functions && npm run lint

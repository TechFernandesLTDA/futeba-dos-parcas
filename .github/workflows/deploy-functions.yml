name: Deploy Functions

# Deploy das Cloud Functions por SERVICE ACCOUNT dedicada (github-deploy@futebadosparcas)
# via Workload Identity Federation (OIDC do GitHub, SEM chave JSON), nunca por conta de
# usuario. Pool `github` / provider `github-oidc` aceitam apenas este repositorio. Workflow manual: roda a partir da master ou de uma
# tag `functions-v*`, exige confirmacao explicita e verifica ao final que todas
# as funcoes estao ACTIVE. O predeploy de firebase.json executa npm ci,
# install:ffmpeg, lint e build. Ref. docs/RELEASE_PROCESS.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "deploy-functions" para confirmar o deploy em producao'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # OIDC para Workload Identity Federation

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: futebadosparcas
  WIF_PROVIDER: projects/490094091078/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOY_SA: github-deploy@futebadosparcas.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy Functions (service account)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      - name: Guard (confirmacao e ref)
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy-functions" ]; then
            echo "::error::Confirmacao invalida (digite deploy-functions)"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/heads/master|refs/tags/functions-v*) ;;
            *) echo "::error::Deploy so a partir da master ou de tag functions-v*: $GITHUB_REF"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Autenticar no Google Cloud (WIF, sem chave)
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy functions
        env:
          HUSKY: '0'
        run: |
          npx --yes firebase-tools@15.23.0 deploy --only functions \
            --project "$FIREBASE_PROJECT" --non-interactive

      - name: Verify all functions ACTIVE
        env:
          HUSKY: '0'
        run: |
          npm ci
          node scripts/ci/verify-functions-active.js --project "$FIREBASE_PROJECT"


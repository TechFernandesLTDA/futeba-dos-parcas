name: "CodeQL Security Analysis"

on:
  # Affected-only (Efficiency Hardening F6): este workflow só analisa
  # javascript-typescript (extrator Java/Kotlin desabilitado neste runner —
  # ver matrix abaixo). Rodar em PRs que não tocam JS/TS analisa ZERO arquivos
  # relevantes e só consome minutos de CI no GitHub-hosted Linux.
  # Seguro: branch protection de master NÃO exige status checks
  # (required_status_checks=null) — pular o check num PR não-JS/TS não trava o
  # merge. O cron semanal abaixo mantém a varredura COMPLETA como safety net.
  push:
    branches: [ "master", "develop" ]
    paths:
      - 'functions/**'
      - 'web/**'
      - 'scripts/**'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'functions/**'
      - 'web/**'
      - 'scripts/**'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '30 1 * * 1'  # Segunda-feira 1:30 AM UTC — varredura COMPLETA (safety net)

# Cancela analise anterior do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # GitHub-hosted ubuntu-latest: o extrator javascript-typescript com
    # build-mode: none nao precisa de Mac/Rosetta. Runner Linux efemero nao
    # acumula _work/_temp entre runs (sem step de cleanup). O upload SARIF para
    # a aba Security continua funcionando normalmente em Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Java/Kotlin desabilitado em macOS ARM64. Tres modos testados:
          # 1. manual: libtrace.dylib e x86_64-only, nao injeta em JDK ARM64
          # 2. none: extrator Kotlin nao processa source files
          # 3. autobuild: falha em deps wasm (composeApp:binaryen)
          # Reabilitar requer JDK x86_64 + Rosetta OU runner Linux.
          # Decisao registrada em specs/DECISIONS.md (2026-05-03).
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57  # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57  # v3
        with:
          category: "/language:${{matrix.language}}"

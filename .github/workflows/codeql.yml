name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '30 1 * * 1'  # Segunda-feira 1:30 AM UTC

# Cancela analise anterior do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Self-hosted Mac ARM64: requer Rosetta 2 (CodeQL CLI e x86_64 binario).
    # JDK 17 (Temurin) ja disponivel via JAVA_HOME no runner.env.
    # setup-java@v4 removido (causava erro -86 spawn em arm64).
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Java/Kotlin desabilitado em macOS ARM64. Tres modos testados:
          # 1. manual: libtrace.dylib e x86_64-only, nao injeta em JDK ARM64
          # 2. none: extrator Kotlin nao processa source files
          # 3. autobuild: falha em deps wasm (composeApp:binaryen)
          # Reabilitar requer JDK x86_64 + Rosetta OU runner Linux.
          # Decisao registrada em specs/DECISIONS.md (2026-05-03).
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Self-hosted runner nao limpa _work/_temp entre runs.
      # CodeQL falha com "Error while recursively deleting codeql_databases/<lang>/src"
      # se diretorios de runs anteriores ainda existem.
      - name: Cleanup CodeQL temp dirs (self-hosted)
        run: |
          rm -rf "$RUNNER_TEMP/codeql_databases" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/codeql-runner" 2>/dev/null || true
          echo "CodeQL temp dirs cleaned"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

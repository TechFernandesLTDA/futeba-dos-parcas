# Fonte de verdade das labels do repositório (sincronizada por .github/workflows/sync-labels.yml).
# Taxonomia documentada em CONTRIBUTING.md. O sync NÃO apaga labels fora deste arquivo (prune: false).
# Para renomear uma label, use a API/UI (preserva as issues) e depois atualize este arquivo.


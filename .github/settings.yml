repository:
  name: futeba-dos-parcas
  description: "Futeba dos Parças — app Android, iOS e Web (PWA) para organizar peladas: jogos, times, placares, grupos e gamificação. Produto da Tech Fernandes LTDA."
  homepage: https://futebadosparcas.com.br
  topics: android, ios, web, pwa, kotlin, kotlin-multiplatform, compose-multiplatform, jetpack-compose, react, typescript, vite, material-ui, firebase, cloud-functions, football, sports, game-management, gamification, tech-fernandes
  private: true
  has_issues: true
  has_projects: true
  has_wiki: false
  has_discussions: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

# Labels: fonte de verdade em .github/labels.yml (sync-labels.yml, prune: false).

branches:
  - name: master
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
      required_status_checks:
        strict: false
        contexts:
          - Lighthouse CI
          - Validate PR
          - Android CI Gate
          - Web CI Gate
      enforce_admins: false
      restrictions: null

repository:
  name: futeba-dos-parcas
  description: App multi-plataforma para organizar partidas de futebol entre amigos — times, placares e gamificação
  homepage: https://futebadosparcas.web.app
  topics: android, kotlin, jetpack-compose, firebase, react, typescript, football, sports, game-management, kmp
  private: true
  has_issues: true
  has_projects: true
  has_wiki: false
  has_discussions: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

labels:
  - name: bug
    color: d73a4a
    description: Algo não está funcionando
  - name: feature
    color: 0e8a16
    description: Nova funcionalidade
  - name: improvement
    color: a2eeef
    description: Melhoria de código existente
  - name: documentation
    color: 0075ca
    description: Documentação
  - name: android
    color: 3DDC84
    description: Relacionado ao app Android
  - name: web
    color: 61DAFB
    description: Relacionado ao app Web
  - name: firebase
    color: FFCA28
    description: Relacionado ao Firebase
  - name: security
    color: d93f0b
    description: Segurança
  - name: performance
    color: 5319e7
    description: Performance
  - name: dependencies
    color: 0366d6
    description: Dependências
  - name: "priority:critical"
    color: B60205
    description: Prioridade crítica
  - name: "priority:high"
    color: FBCA04
    description: Prioridade alta
  - name: "priority:medium"
    color: 0E8A16
    description: Prioridade média
  - name: "priority:low"
    color: C5DEF5
    description: Prioridade baixa
  - name: "status:blocked"
    color: "000000"
    description: Bloqueado
  - name: "status:in-progress"
    color: 1D76DB
    description: Em andamento
  - name: "status:review"
    color: D4C5F9
    description: Em revisão
  - name: good-first-issue
    color: 7057ff
    description: Bom para iniciantes
  - name: help-wanted
    color: "008672"
    description: Ajuda necessária

branches:
  - name: master
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - "build (ubuntu-latest)"
          - lint
          - detekt
      enforce_admins: false
      restrictions: null

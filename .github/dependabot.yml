# Dependabot enxuto (09/10/2026). Cada PR custa 30-60 min de CI serial nos runners do PC.
# - 1 PR por ecossistema/mês com TODAS as atualizações minor/patch (grupo único).
# - Majors NUNCA viram PR automático: migração de major é issue planejada (ex.: #4265).
# - rebase-strategy: disabled. Sem isso, cada merge no master rebaseia todos os PRs abertos
#   e roda o CI inteiro de novo. Para atualizar um PR, comente `@dependabot rebase`.
# - Alertas e PRs de SEGURANÇA continuam ativos (Dependabot security updates); revise os alertas.
version: 2
updates:
- package-ecosystem: gradle
  directory: /
  schedule:
    interval: monthly
    time: 09:00
    timezone: America/Sao_Paulo
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - type:chore
  commit-message:
    prefix: chore(deps)
    include: scope
  groups:
    gradle-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  - &id001
    dependency-name: '*'
    update-types:
    - version-update:semver-major
  - dependency-name: org.jetbrains.kotlin*
    update-types:
    - version-update:semver-minor
  - dependency-name: org.jetbrains.kotlinx*
    update-types:
    - version-update:semver-minor
  - dependency-name: com.google.devtools.ksp*
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  - dependency-name: org.jetbrains.compose*
    update-types:
    - version-update:semver-minor
  - dependency-name: app.cash.sqldelight*
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  - dependency-name: com.google.android.libraries.identity.googleid:googleid
    update-types:
    - version-update:semver-patch
    - version-update:semver-minor
    - version-update:semver-major
  - dependency-name: io.insert-koin*
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  - dependency-name: io.coil-kt.coil3*
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  - dependency-name: org.jetbrains.androidx.lifecycle*
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  rebase-strategy: disabled
- package-ecosystem: npm
  directory: /functions
  schedule:
    interval: monthly
    time: 09:00
    timezone: America/Sao_Paulo
  open-pull-requests-limit: 2

name: 💡 Feature Request
description: Sugerir uma nova funcionalidade ou melhoria
title: "[FEATURE] "
labels: ["type:feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pela sugestão! Descreva o problema antes da solução.

  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      description: Onde o problema ocorre?
      options:
        - 📱 Android
        - 🍎 iOS
        - 🌐 Web
        - ⚙️ Backend (Cloud Functions)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problema que resolve
      placeholder: Como organizador/jogador, eu gostaria de...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas

  # Lido por .github/workflows/issue-automation.yml (priority:high|medium|low).
  - type: dropdown
    id: priority
    attributes:
      label: Prioridade sugerida
      options:
        - 🔴 Alta
        - 🟡 Média
        - 🟢 Baixa

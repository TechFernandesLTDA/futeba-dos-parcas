<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Futeba dos Parças</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      background: #0a0a0a;
      color: #f5f5f5;
    }
    @media (prefers-color-scheme: light) {
      body { background: #fafafa; color: #1a1a1a; }
    }
    .emoji { font-size: 64px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0; }
    p { margin: 0; opacity: 0.7; max-width: 360px; line-height: 1.5; }
    button {
      margin-top: 8px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #4caf50;
      color: #fff;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="emoji" aria-hidden="true">⚽</div>
  <h1>Você está sem conexão</h1>
  <p>Não foi possível carregar o Futeba dos Parças. Verifique sua internet e tente novamente.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</body>
</html>
